name: Build GKI kernel (KernelSU-Next + SUSFS) - Pixel 11 Pro XL / kodiak

# =============================================================================
# WHAT THIS BUILDS
#   A GKI kernel for the Pixel 11 Pro XL (**kodiak**, Tensor G6) from Google's own
#   android16-6.12 KMI line, with KernelSU-Next + SUSFS compiled in, packaged as an
#   AnyKernel3 zip (flashed with KernelFlasher on the phone) plus the raw
#   Image / Image.lz4 for the manual MagiskBoot route.
#
# WHY android16-6.12 AND NOT android17-6.18  (this is the whole ball game)
#   The device runs Android 17 (CD1A.260905.001.B1) but its KERNEL is 6.12, not 6.18:
#
#     $ adb shell uname -r
#     6.12.69-android16-9-g84174099
#     $ adb shell su -c "strings /vendor/lib/modules/*.ko | grep -m1 vermagic="
#     vermagic=6.12.69-android16-6-g6a49175400c0-ab16238327-4k SMP preempt mod_unload modversions aarch64
#     $ adb shell su -c "ls /vendor/lib/modules | wc -l"
#     128
#
#   Those 128 modules are prebuilt by Google and were compiled against the
#   **android16-6.12** KMI (that "-ab16238327" is this exact build). With
#   CONFIG_MODVERSIONS=y the kernel compares symbol CRCs, and those CRCs are frozen
#   per KMI generation - so the kernel MUST come from android16-6.12. Building from
#   android17-6.18 (ACK's 6.18 line, i.e. what "Android 17" uses upstream) would give
#   different CRCs and every vendor module would refuse to load: dead Wi-Fi/camera/audio.
#
#   Branch naming, read off kernel/manifest (+refs):
#     common-android16-6.12-2026-03   <- SUBLEVEL 69 == what the device runs today
#     common-android16-6.12-2026-06   6.12.81
#     common-android16-6.12-2026-09   newest dated release of this KMI line
#     common-android16-6.12-lts       moving target
#   Any of them is CRC-safe (same KMI). 2026-03 is the default because it reproduces
#   the sublevel the phone actually boots - the least surprising thing to flash.
#
# WHY IT LOOKS STOCK-ISH: we do NOT invent a release string. kleaf --config=stamp
#   derives it from SCM, and step "Kill -dirty/-maybe-dirty" removes the suffix kleaf
#   would otherwise add, so UTS_RELEASE stays a clean 6.12.69-android16-<n>-g<hash>
#   (the Wild Kernel currently on the phone reads 6.12.69-android16-9-g84174099).
#
# A note on refs: SUSFS lives on GITLAB (gitlab.com/simonpunk/susfs4ksu), not GitHub,
#   and its patches target a specific KernelSU. We therefore use the SUSFS fork of
#   KernelSU-Next (pershoot/KernelSU-Next, branch dev-susfs) where SUSFS is already
#   integrated, and only apply SUSFS's KERNEL-side patch - never its
#   kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch, which targets upstream
#   tiann/KernelSU and only produces rejects here.
# =============================================================================

on:
  workflow_dispatch:
    inputs:
      kernel_branch:
        description: 'ACK branch under kernel/manifest (official name: common-<android>-<kver>-<date>). Default = 6.12.69, the sublevel the phone runs today.'
        required: true
        default: 'common-android16-6.12-2026-03'
      expected_sublevel:
        description: 'GATE: Makefile SUBLEVEL of the synced tree must equal this (69 == kodiak stock 6.12.69). Set empty to skip the gate.'
        required: false
        default: '69'
      ksu_repo:
        description: 'KernelSU-Next fork carrying SUSFS (its kernel/setup.sh is used as the integrator).'
        required: true
        default: 'https://github.com/pershoot/KernelSU-Next.git'
      ksu_branch:
        description: 'KernelSU-Next branch, tag or commit. DEFAULT dev-susfs = always the LATEST commit on that branch; the resolved SHA is printed by the install step and recorded in the run summary, so every build stays identifiable. It MUST be a dev-susfs ref: SUSFS exists ONLY on that branch, and upstream commits carry ZERO KSU_SUSFS - 39ba3821, the commit the phone ksud 3.3.0-41 was built from, is upstream, and pinning to it failed runs #21 and #23. Pass a 40-char SHA only when you need to reproduce an older build exactly (a branch that gets rebased, as dev-susfs was on 2026-10-03, makes two runs incomparable).'
        required: true
        default: 'dev-susfs'
      susfs_branch:
        description: 'susfs4ksu branch on GitLab. Must carry a *android16-6.12* kernel patch.'
        required: true
        default: 'gki-android16-6.12'
      susfs_commit:
        description: 'susfs4ksu (GitLab) commit. DEFAULT EMPTY = the gki-android16-6.12 branch tip, i.e. always the latest SUSFS, which is the partner for the KernelSU dev-susfs tip above; the resolved commit is recorded in the run summary. Do not pin 75a613850178234c6c7595d1db8211716a011a2e: dated 2026-05-17, it predates the susfs_is_current_proc_no_su API the KSU tip calls, so the build dies with "call to undeclared function". Put a SHA here only to reproduce an older build.'
        required: false
        default: ''
      expected_uts_release:
        description: 'GATE: the exact UTS_RELEASE the built Image must report (i.e. uname -r). Default is the value the STOCK BOOT KERNEL carries, read by decompressing the factory boot.img: 6.12.69-android16-6-g5c5f2fea42dd-ab15835541-4k. (The vendor_dlkm modules carry a different Google build stamp - g6a49175400c0-ab16238327 - because Google builds them in a separate job; they stay loadable via symbol CRCs, so that is NOT what uname -r should say.) The workflow forces the release and the build timestamp into the build and fails if the Image disagrees. Empty = do not force, do not check.'
        required: false
        default: '6.12.69-android16-6-g5c5f2fea42dd-ab15835541-4k'
      expected_build_timestamp:
        description: 'GATE: the exact build timestamp shown by uname -v and /proc/version. Default is the stock boot kernel value read from the factory boot.img. kleaf forces SOURCE_DATE_EPOCH=0, which is why ours read Thu Jan 1 00:00:00 UTC 1970; the workflow patches that and checks the banner. Empty = do not force, do not check.'
        required: false
        default: 'Fri Jul 10 21:44:24 UTC 2026'
      os_patch_level:
        description: 'Device security patch level (YYYY-MM). Used for the kernel build timestamp and the docs/summary.'
        required: true
        default: '2026-09'
      patches:
        description: 'What to integrate. ksu-susfs = the real build. ksun-only = KernelSU-Next without SUSFS. none = VANILLA CONTROL (same tree, same defconfig, no KernelSU/SUSFS at all).'
        required: true
        default: 'ksu-susfs'
        type: choice
        options:
          - ksu-susfs
          - ksun-only
          - none
      bypass_module_versions:
        description: 'LAST RESORT: also build a second Image with the module-version check neutered (kernel/module/version.c bad_version: return 0 -> return 1). Only useful if the stock vendor modules reject the kernel.'
        required: true
        default: false
        type: boolean
      boot_img:
        description: 'Also produce a boot.img for fastboot flash. none = AnyKernel3 only; plain = mkbootimg header v4 (nothing else - that IS the stock layout); avb = the same image plus an AVB hash footer sized to the boot partition.'
        required: true
        default: 'plain'
        type: choice
        options:
          - none
          - plain
          - avb
      avb_partition_size:
        description: 'boot partition size in bytes, used only for boot_img=avb. kodiak boot_a and boot_b are exactly 67108864 (64 MiB) - verified with blockdev --getsize64 on the device.'
        required: false
        default: '67108864'
      bootimg_os_version:
        description: 'Optional: mkbootimg --os_version. LEAVE EMPTY. Google''s own factory boot.img for this build (kodiak-cd1a.260905.001.b1) has os_version = 0 - it is only init_boot.img that carries 17.0.0. Setting this would make the header differ from stock and the verifier will fail the run.'
        required: false
        default: ''
      bootimg_os_patch_level:
        description: 'Optional: mkbootimg --os_patch_level. LEAVE EMPTY for the same reason (stock boot.img has patch level 0; stock init_boot has 2026-09).'
        required: false
        default: ''
      features:
        description: 'Extra, non-KernelSU/SUSFS feature set ported from asdfmonster261/heybooboo-kernel. heybooboo-phase12 = container namespaces/SysV IPC + binfmt_misc fixes + ntsync + BBRv3 + f2fs/vfs/int_sqrt tuning + tcpm DRP (recovery USB-OTG host). none = the bare KSU/SUSFS kernel, i.e. exactly run #30. Later phases (BORE, Baseband-guard, arm64 memcpy) are separate commits, not inputs.'
        required: false
        default: 'heybooboo-phase12'
        type: choice
        options:
          - none
          - heybooboo-phase12
          - phase3
      nomount:
        description: 'Build NoMount (maxsteeel/nomount) into the kernel - a VFS path-redirection framework. Built-in support is what the NoMount metamodule probes for first ("nm version"); without it, on a custom kernel, it falls back to a pre-compiled LKM it may not have, which is exactly what "Kernel not patched or module failed to load" means. Independent of features.'
        required: false
        default: 'off'
        type: choice
        options:
          - 'off'
          - 'on'
      nomount_commit:
        description: 'NoMount commit to build. DEFAULT = the pinned latest on master (c5fad9d8f97c, 2026-10-01). Pass a full 40-char SHA to assert an exact revision; the run fails if HEAD does not match.'
        required: false
        default: 'c5fad9d8f97c5a207f7342fd91789449915ea047'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 200

    steps:
      - name: Checkout this repo (workflow + scripts)
        uses: actions/checkout@v4

      # ------------------------------------------------------------------ 1. disk
      # A kleaf kernel build is disk-hungry, and the stock ubuntu-latest image leaves /
      # nearly full - the runner can die with "No space left on device" while writing its
      # OWN diagnostic log (seen on the phone-2a pipeline). Reclaim first, then assert.
      - name: Free disk space
        run: |
          echo "================= BEFORE =================="
          df -h / /mnt 2>/dev/null || df -h

          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm /usr/local/lib/node_modules \
                      /opt/az /usr/local/aws-cli /usr/local/aws-sam-cli \
                      /usr/share/gradle /usr/share/miniconda 2>/dev/null || true
          sudo apt-get -qq clean || true
          sudo rm -rf /var/lib/apt/lists/* || true

          echo "================= AFTER =================="
          df -h / /mnt 2>/dev/null || df -h

          # The artifact name is exported in this, the FIRST step, so the always-run summary still
          # has a name when a later step fails and the rest are skipped (run #1's summary printed
          # "-AnyKernel3.zip" for exactly that reason). It is set before the gate below on purpose.
          echo "FILE_NAME=kodiak-6.12.${{ inputs.expected_sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.patches }}" >> "$GITHUB_ENV"

          AVAIL_GB=$(df -BG --output=avail / | tail -1 | tr -dc '0-9')
          echo "root filesystem has ${AVAIL_GB}GB free"
          if [ "${AVAIL_GB:-0}" -lt 45 ]; then
            echo "::error::only ${AVAIL_GB}GB free on / - a kleaf build needs ~45GB+; refusing to burn 3h on a run that will ENOSPC"
            exit 1
          fi

      # ------------------------------------------------------------- 2. swap headroom
      # LESSON FROM RUN #1: this step killed the job in 2 minutes with
      #     fallocate: fallocate failed: Text file busy
      #     dd: failed to open '/swapfile': Text file busy
      # because GitHub's ubuntu-latest image ALREADY HAS /swapfile active - the file is open, so
      # it cannot be created or written. Two corrections:
      #   * if swap is already on, do nothing and say so;
      #   * otherwise try a free path on a real filesystem, and never fail the job over it.
      # Swap is head-room here, not a requirement: this build uses kleaf --config=fast (no LTO),
      # so the 16 GB of RAM is normally enough and an OOM is the only thing that would miss it.
      - name: Add swap (best effort)
        run: |
          set -o pipefail
          echo "---- swap BEFORE ----"
          swapon --show || true
          free -h || true

          if swapon --show | grep -q .; then
            echo "swap is already active on this runner - nothing to add"
          else
            enabled=""
            for dir in /mnt /var/tmp /tmp; do
              [ -d "$dir" ] || continue
              f="$dir/swapfile-kodiak"
              echo "---- trying $f ----"
              if sudo fallocate -l 8G "$f" 2>/dev/null || sudo dd if=/dev/zero of="$f" bs=1M count=8192 2>/dev/null; then
                sudo chmod 600 "$f"
                if sudo mkswap "$f" >/dev/null 2>&1 && sudo swapon "$f" 2>/dev/null; then
                  echo "swap enabled at $f"
                  enabled="$f"
                  break
                fi
                sudo rm -f "$f"
              fi
            done
            if [ -z "$enabled" ]; then
              echo "::warning::could not enable extra swap - continuing anyway (the build uses --config=fast, so no full-LTO memory spike)"
            fi
          fi

          echo "---- swap AFTER ----"
          swapon --show || true
          free -h || true

      # ------------------------------------------------- 3. kernel source (manifest)
      # Google's kernel is a multi-repo tree (common + build + prebuilts), so `repo` - not a
      # plain git clone - is what kleaf expects. The manifest branch is the ACK branch, and
      # init was already done above in the workspace, so the tree lands in ./kernel.
      - name: Fetch the kernel source (repo init + sync)
        run: |
          set -o pipefail
          mkdir -p "$GITHUB_WORKSPACE/git-repo"
          curl -L https://storage.googleapis.com/git-repo-downloads/repo -o "$GITHUB_WORKSPACE/git-repo/repo"
          chmod +x "$GITHUB_WORKSPACE/git-repo/repo"
          export PATH="$GITHUB_WORKSPACE/git-repo:$PATH"
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          BRANCH="${{ inputs.kernel_branch }}"
          MANIFEST=https://android.googlesource.com/kernel/manifest
          ACK_COMMON=https://android.googlesource.com/kernel/common
          echo "ACK branch requested: $BRANCH"

          # LESSON FROM RUN #2: this branch name exists in TWO repos under TWO names.
          #   repo init -b  ->  kernel/MANIFEST  ->  refs/heads/common-android16-6.12-2026-03
          #   repo sync     ->  kernel/COMMON    ->  refs/heads/android16-6.12-2026-03   (no "common-" prefix)
          # Run #2 asked kernel/common for the *manifest* name, found nothing, and aborted after five
          # minutes with a message that made it look like the branch did not exist at all. So: gate on
          # the manifest repo (that is what repo init consumes), then report the ACK branch for info.
          if ! git ls-remote "$MANIFEST" "refs/heads/$BRANCH" | grep -q .; then
            echo "::error::$BRANCH does not exist in kernel/manifest (the repo repo-init reads)"
            echo "---- manifest branches for this KMI line ----"
            git ls-remote --heads "$MANIFEST" \
              | awk '{print $2}' | sed 's#refs/heads/##' \
              | grep -E '^common-android1[567]-(6\.12|6\.18)' | sort || true
            exit 1
          fi
          echo "OK   kernel/manifest has refs/heads/$BRANCH"

          ACK_BRANCH="${BRANCH#common-}"
          if git ls-remote "$ACK_COMMON" "refs/heads/$ACK_BRANCH" | grep -q .; then
            echo "OK   kernel/common has refs/heads/$ACK_BRANCH (the tree repo sync checks out)"
          else
            echo "::warning::kernel/common has no refs/heads/$ACK_BRANCH - the manifest may point elsewhere; repo sync below will say so"
          fi

          mkdir -p "$GITHUB_WORKSPACE/kernel"
          cd "$GITHUB_WORKSPACE/kernel"

          repo init -u https://android.googlesource.com/kernel/manifest -b "$BRANCH" --depth=1
          # -c / --current-branch keeps only the single branch we asked for. Retry: the sync pulls
          # tens of GB from googlesource and a transient 5xx is common.
          n=0
          until [ "$n" -ge 3 ]; do
            n=$((n+1))
            echo "repo sync attempt $n/3"
            if repo sync -c --current-branch --no-clone-bundle --no-tags --jobs-checkout=4 -j4; then
              break
            fi
            if [ "$n" -ge 3 ]; then echo "::error::repo sync failed 3x"; exit 1; fi
            rm -rf .repo/manifests .repo/manifest.xml 2>/dev/null || true
            sleep 20
          done

          echo "---- tree ----"
          ls -la
          echo "---- common/ present? ----"
          ls -la common/Makefile common/arch/arm64/configs/gki_defconfig

      # The single cheapest guard in the whole pipeline: if the sublevel in the tree is not the
      # one we think we synced, everything downstream (release string, "does it look stock") is
      # wrong - and we would only find out after a 2h build + a flash.
      - name: Gate - pinned sublevel, KMI sanity
        run: |
          set -o pipefail
          MF="$GITHUB_WORKSPACE/kernel/common/Makefile"
          V=$(grep '^VERSION = '    "$MF" | awk '{print $3}')
          P=$(grep '^PATCHLEVEL = ' "$MF" | awk '{print $3}')
          S=$(grep '^SUBLEVEL = '   "$MF" | awk '{print $3}')
          echo "tree says: $V.$P.$S   (branch ${{ inputs.kernel_branch }})"

          if [ "$V.$P" != "6.12" ]; then
            echo "::error::this workflow is only valid for the 6.12 KMI line - got $V.$P"
            exit 1
          fi
          WANT="${{ inputs.expected_sublevel }}"
          if [ -n "$WANT" ] && [ "$S" != "$WANT" ]; then
            echo "::error::sublevel $S != expected $WANT - you are on a different dated branch of the KMI line"
            echo "  (CRCs would still match, but the release string would not be the one this repo pins)"
            exit 1
          fi
          echo "OK   $V.$P.$S on the android16-6.12 KMI line"
          # gki_defconfig must exist: it is the file we patch in step 6.
          test -f "$GITHUB_WORKSPACE/kernel/common/arch/arm64/configs/gki_defconfig" \
            || { echo "::error::common/arch/arm64/configs/gki_defconfig missing"; exit 1; }

      # ----------------------------------------------------- 4. reproducible timestamp
      # Same trick WildKernels use: pin the build clock to the device's own patch level
      # (5th of that month, 04:20 UTC). Two reasons - byte-identical rebuilds, and a kernel
      # whose build date is not "today" but the release it belongs to.
      - name: Pin the build timestamp
        run: |
          set -o pipefail
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^([0-9]{4})-([0-9]{2})$ ]]; then
            FIXED_BUILD_DATE="${BASH_REMATCH[1]}-${BASH_REMATCH[2]}-05 04:20:00 UTC"
            SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
            KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
            GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
            {
              echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH"
              echo "KBUILD_BUILD_TIMESTAMP=$KBUILD_TS"
              echo "GIT_COMMITTER_DATE=$GIT_DATE"
              echo "GIT_AUTHOR_DATE=$GIT_DATE"
            } >> "$GITHUB_ENV"
            echo "build clock pinned to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch $SOURCE_DATE_EPOCH)"
          else
            echo "::warning::os_patch_level '$OS_PATCH_LEVEL_INPUT' is not YYYY-MM - leaving the build clock alone"
          fi

      # ------------------------------------------------------- 5. KernelSU-Next (root)
      # Integration is done by KernelSU-Next's OWN installer (kernel/setup.sh), which is what
      # makes drivers/kernelsu + the Kconfig/Makefile wiring appear in common/. Its setup.sh
      # hardcodes its fork owner, so only that URL is passed - the tree wiring is untouched.
      #
      # LAYOUT - verified against setup.sh's source and run #3's log, do not "tidy" this path:
      #   setup.sh does  GKI_ROOT=$(pwd)  and  REPO="KernelSU-Next", then
      #     - clones to            $GKI_ROOT/KernelSU-Next          (the ACK ROOT, not common/)
      #     - checks out $1        (the KSU ref) inside that clone
      #     - symlinks             $GKI_ROOT/common/drivers/kernelsu -> ../../KernelSU-Next/kernel
      #     - appends              obj-$(CONFIG_KSU) += kernelsu/   to common/drivers/Makefile
      #     - appends              source "drivers/kernelsu/Kconfig" to common/drivers/Kconfig
      #   So it MUST run with CWD = $GITHUB_WORKSPACE/kernel (from common/ the relative symlink and
      #   the "common/drivers" probe both come out wrong), and the checkout is always
      #   <root>/KernelSU-Next - there is no common/KernelSU-Next. Run #3 integrated perfectly and
      #   then failed its last diagnostic line only because that line said common/KernelSU-Next.
      #
      # DO NOT apply susfs4ksu's kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch here.
      # That patch targets UPSTREAM tiann/KernelSU; against this fork it rejects ~10 hunks
      # (kernel/Kbuild, core/init.c, feature/sucompat.c, hook/setuid_hook.c, supercall/*,
      # feature/kernel_umount.c) and every one is load-bearing. A Kconfig grep once made that
      # look "green" on the phone-2a pipeline and burned hours. The fork already has SUSFS.
      - name: KernelSU-Next - install into common/
        if: ${{ inputs.patches != 'none' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          KSU_REPO="${{ inputs.ksu_repo }}"
          KSU_REF="${{ inputs.ksu_branch }}"
          echo "KernelSU-Next: $KSU_REPO @ $KSU_REF"

          # setup.sh must come from the very ref we want, otherwise the checkout below is a
          # different tree than the one the integrator wired in.
          curl -LSs "${KSU_REPO%.git}/raw/$KSU_REF/kernel/setup.sh" | bash -s "$KSU_REF" || {
            echo "::warning::raw/$KSU_REF/setup.sh not fetchable - falling back to the fork's dev-susfs URL"
            curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/dev-susfs/kernel/setup.sh" | bash -s "$KSU_REF"
          }

          test -d KernelSU-Next/kernel || { echo "::error::setup.sh did not produce KernelSU-Next/kernel"; exit 1; }

          # ---------------------------------------------------------------------------------
          # PIN THE REF EXACTLY - RUN #21 LESSON. This is where that run died, silently, and the
          # Kconfig gate 10 minutes later was the only thing that noticed:
          #   setup.sh CLONES A REPO and checks its argument out as a BRANCH (falling back to the
          #   clone's default branch). Our pinned ref is a commit SHA, so the checkout could not
          #   land on it and the tree stayed on the clone's DEFAULT branch - upstream
          #   KernelSU-Next, which carries no SUSFS at all. The gate then said "this
          #   KernelSU-Next ref does NOT carry SUSFS", which was true but blamed the ref rather
          #   than the missing checkout.
          # So: point origin at the requested fork, fetch the ref explicitly, detach - and ASSERT.
          # Never trust setup.sh's checkout when the ref is a SHA.
          # ---------------------------------------------------------------------------------
          git -C KernelSU-Next/kernel remote set-url origin "$KSU_REPO"
          if ! git -C KernelSU-Next/kernel fetch --depth=200 origin "$KSU_REF"; then
            echo "direct fetch of $KSU_REF failed - deepening from the branch instead"
            git -C KernelSU-Next/kernel fetch --depth=2000 origin dev-susfs \
              || git -C KernelSU-Next/kernel fetch origin dev-susfs
            git -C KernelSU-Next/kernel fetch origin "$KSU_REF" \
              || { echo "::error::cannot obtain $KSU_REF from $KSU_REPO"; exit 1; }
          fi
          git -C KernelSU-Next/kernel checkout --detach FETCH_HEAD
          HEAD_SHA=$(git -C KernelSU-Next/kernel rev-parse HEAD)
          echo "KernelSU-Next HEAD now: $HEAD_SHA   (requested: $KSU_REF)"
          case "$KSU_REF" in
            [0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f]*)
              [ "$HEAD_SHA" = "$KSU_REF" ] || {
                echo "::error::KernelSU-Next HEAD is $HEAD_SHA but the requested commit is $KSU_REF - refusing to build from the wrong tree"
                exit 1; } ;;
            *) echo "  (ref is a branch/tag - HEAD is wherever it points now)" ;;
          esac
          KSU_SUSFS_N=$(grep -c 'KSU_SUSFS' KernelSU-Next/kernel/Kconfig 2>/dev/null || true)
          echo "KSU_SUSFS occurrences in the installed kernel/Kconfig: ${KSU_SUSFS_N:-0} (the gate below needs >0)"

          # Version stamping, exactly as KernelSU-Next does it upstream: the manager compares
          # these fallbacks with its own API. Without this the manager reports a bogus version.
          cd KernelSU-Next/kernel
          COMMITS_COUNT=$(/usr/bin/git rev-list --count HEAD)
          KSU_VERSION=$(expr "$COMMITS_COUNT" + 30000)
          sed -i "s/^KSU_VERSION_FALLBACK := 1$/KSU_VERSION_FALLBACK := ${KSU_VERSION}/"             Kbuild || true
          KSU_GIT_TAG="$(git describe --tags --abbrev=0 2>/dev/null || echo v0.0.1)"
          sed -i "s/^KSU_VERSION_TAG_FALLBACK := v0.0.1$/KSU_VERSION_TAG_FALLBACK := ${KSU_GIT_TAG}/" Kbuild || true
          echo "KSU_COMMIT=$(git rev-parse --short HEAD)"  >> "$GITHUB_ENV"
          echo "KSU_VERSION=$KSU_VERSION"                  >> "$GITHUB_ENV"
          echo "KSU_GIT_TAG=$KSU_GIT_TAG"                  >> "$GITHUB_ENV"

          # Non-fatal on purpose: the runner shell is `bash -e`, and in run #3 a bare `ls` of a
          # wrong path (exit 2) killed this step *after* the integration had already succeeded.
          ls -la "$GITHUB_WORKSPACE/kernel/KernelSU-Next" | head -20 || true
          # What actually matters is the wiring into the kernel tree, so assert that instead of
          # trusting the clone's location: setup.sh must have created the relative symlink.
          test -e "$GITHUB_WORKSPACE/kernel/common/drivers/kernelsu" \
            || { echo "::error::common/drivers/kernelsu symlink missing - setup.sh wiring did not happen"; exit 1; }
          echo "---- drivers/Makefile + drivers/Kconfig after wiring ----"
          grep -n 'kernelsu' "$GITHUB_WORKSPACE/kernel/common/drivers/Makefile" \
                            "$GITHUB_WORKSPACE/kernel/common/drivers/Kconfig" || true

      # The API contract that must hold before we spend two hours compiling:
      #   KernelSU side -> does the fork declare the SUSFS options at all?
      # (all of CONFIG_KSU_SUSFS* is *selected by* that declaration; without it kconfig silently
      # drops our fragment lines and we would ship a kernel whose SUSFS hooks go nowhere.)
      - name: Gate - SUSFS is wired into KernelSU-Next
        if: ${{ inputs.patches == 'ksu-susfs' }}
        run: |
          set -o pipefail
          KC="$GITHUB_WORKSPACE/kernel/KernelSU-Next/kernel/Kconfig"   # ACK root, not common/ (see step 5)
          test -f "$KC" || { echo "::error::$KC missing - KernelSU integration did not happen"; exit 1; }
          N=$(grep -c 'KSU_SUSFS' "$KC" || true)
          echo "KSU_SUSFS occurrences in KernelSU-Next/kernel/Kconfig: $N"
          if [ "${N:-0}" -eq 0 ]; then
            echo "::error::this KernelSU-Next ref does NOT carry SUSFS - use the pershoot dev-susfs fork"
            echo "::error::(upstream KernelSU-Next declares only KSU, KSU_DEBUG, KSU_DISABLE_MANAGER, KSU_DISABLE_POLICY)"
            exit 1
          fi
          grep -nE 'KSU_SUSFS' "$KC" | head -15 || true

      # ------------------------------------------------------------------- 6. SUSFS
      # SUSFS = susfs4ksu on GITLAB (not GitHub) + a kernel-side patch whose name encodes the
      # exact kernel line: kernel_patches/50_add_susfs_in_gki-android16-6.12.patch.
      #
      # The two `sed` fixups BEFORE the patch are not cosmetic: simonpunk's patch is written
      # against an older 6.12 and on this sublevel it either fails to apply or produces a
      # non-building tree without them. Both are lifted from the kernel WildKernels ship for
      # this exact line (their .github/actions/susfs-patches, android16-6.12 branch):
      #   * sublevel >= 58 - fs/exec.c already includes <linux/dma-buf.h>, so the hunk that
      #     adds it has to be neutralised first, or "patch would apply to a different file".
      #   * sublevel >= 69 - fs/proc/task_mmu.c renamed vma_data_pages -> vma_pages, so the
      #     OPEN_REDIRECT hunk has to be rewritten to the new name.
      # The two fixups AFTER the patch cover helpers that only exist on branches carrying
      # Google's page-size-migration feature (VMA_PAD_START, __fold_filemap_fixup_entry).
      - name: SUSFS - copy sources and apply the kernel patch
        if: ${{ inputs.patches == 'ksu-susfs' }}
        run: |
          set -o pipefail
          S="$GITHUB_WORKSPACE/susfs4ksu"
          BRANCH="${{ inputs.susfs_branch }}"
          SVER="${BRANCH#gki-}"          # gki-android16-6.12 -> android16-6.12
          echo "SUSFS branch $BRANCH  (patch suffix: $SVER)"

          if ! git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git "$BRANCH" | grep -q .; then
            echo "::error::susfs4ksu has no branch $BRANCH"
            git ls-remote --heads https://gitlab.com/simonpunk/susfs4ksu.git | awk '{print $2}' | sed 's#refs/heads/##' | sort || true
            exit 1
          fi
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b "$BRANCH" "$S"
          if [ -n "${{ inputs.susfs_commit }}" ]; then
            echo "pinning SUSFS to ${{ inputs.susfs_commit }}"
            # The clone above is --depth=1, so a historical commit is usually absent locally. Try the
            # cheap fetch first, then deepen, then fall back to full history; and if the checkout still
            # fails say so clearly instead of letting bash -e print a bare "pathspec" error.
            if ! git -C "$S" fetch --depth=50 origin "${{ inputs.susfs_commit }}" 2>/dev/null; then
              echo "shallow fetch of the commit failed - deepening the clone"
              git -C "$S" fetch --depth=500 origin "$BRANCH" || git -C "$S" fetch --unshallow origin || true
            fi
            if ! git -C "$S" checkout "${{ inputs.susfs_commit }}"; then
              echo "::error::cannot check out SUSFS commit ${{ inputs.susfs_commit }} on branch $BRANCH"
              git -C "$S" log --oneline -3 || true
              exit 1
            fi
            echo "SUSFS pinned at $(git -C "$S" rev-parse --short HEAD) ($(git -C "$S" log -1 --format=%ci))"
          fi
          echo "SUSFS commit: $(git -C "$S" rev-parse --short HEAD)"
          # Record the RESOLVED commit, not just the requested ref: with a branch input (="always
          # the latest") the summary would otherwise show an empty pin and you could not tell which
          # SUSFS a given build actually used. This is what makes a moving branch traceable.
          echo "SUSFS_COMMIT=$(git -C "$S" rev-parse --short HEAD)" >> "$GITHUB_ENV"
          echo "SUSFS_DATE=$(git -C "$S" log -1 --format=%cs)" >> "$GITHUB_ENV"
          SUSFS_VERSION=$(grep -m1 '#define SUSFS_VERSION' "$S/kernel_patches/include/linux/susfs.h" | awk -F'"' '{print $2}')
          echo "SUSFS_VERSION=${SUSFS_VERSION:-unknown}" >> "$GITHUB_ENV"

          # ---------------------------------------------------------- mandatory gates
          PATCH="$S/kernel_patches/50_add_susfs_in_gki-$SVER.patch"
          if [ ! -f "$PATCH" ]; then
            echo "::error::missing $PATCH - this SUSFS branch does not target $SVER"
            ls -la "$S"/kernel_patches/ | head -30 || true
            exit 1
          fi
          ls -la "$S"/kernel_patches/fs/ "$S"/kernel_patches/include/linux/ | head -30 || true

          cd "$GITHUB_WORKSPACE/kernel/common"

          # ------------------------------------------- pre-patch fixups (see comment above)
          SUB=$(grep '^SUBLEVEL = ' Makefile | awk '{print $3}')
          echo "patching tree at sublevel $SUB"
          # RUN #7 LESSON: this block used to delete the stock `#include <linux/dma-buf.h>` from
          # fs/exec.c unconditionally, on the theory that the SUSFS patch adds it too. On this tree
          # it does NOT - the pinned and the tip patch both contain zero "dma-buf" strings - while
          # stock 6.12 fs/exec.c needs that include for dma_buf_begin_new_exec()/get_dmabuf_info().
          # Deleting it cost a 30-minute build ending in:
          #   fs/exec.c:1280: error: call to undeclared function 'dma_buf_begin_new_exec'
          #   fs/exec.c:1313: error: call to undeclared function 'get_dmabuf_info'
          # Only strip it if the patch really adds the include (a duplicate would reject instead).
          if grep -q '^+#include <linux/dma-buf.h>' "$PATCH"; then
            echo "  [fixup] the patch adds <linux/dma-buf.h> - dropping the stock one from fs/exec.c to avoid a duplicate"
            sed -i '/^#include <linux\/dma-buf.h>$/d' fs/exec.c
          else
            echo "  [fixup] the patch does not touch <linux/dma-buf.h> - leaving the stock include in fs/exec.c"
          fi
          echo "  stock dma-buf includes now in fs/exec.c: $(grep -c '^#include <linux/dma-buf.h>' fs/exec.c || true)"
          if [ "$SUB" -ge 69 ]; then
            echo "  [>=69] fs/proc/task_mmu.c: vma_data_pages -> vma_pages"
            sed -i 's/vma_data_pages/vma_pages/g' fs/proc/task_mmu.c
          fi

          # ------------------------------------------------------------------ apply
          cp -v "$S"/kernel_patches/fs/*            fs/
          cp -v "$S"/kernel_patches/include/linux/* include/linux/
          cp -v "$PATCH" ./
          echo "---- applying $(basename "$PATCH") ----"
          patch -p1 --forward -F3 < "$(basename "$PATCH")" || echo "::warning::patch reported rejects - the gate below decides"

          # ------------------------------------------- post-patch fixups (see comment above)
          if grep -q 'VMA_PAD_START(' fs/proc/task_mmu.c && \
             ! grep -qE '#include <linux/pgsize_migration(_inline)?\.h>|define VMA_PAD_START' fs/proc/task_mmu.c; then
            echo "  adding VMA_PAD_START fallback to fs/proc/task_mmu.c"
            sed -i '1a #ifndef VMA_PAD_START\n#define VMA_PAD_START(vma) ((vma)->vm_end)\n#endif' fs/proc/task_mmu.c
          fi
          if grep -q '__fold_filemap_fixup_entry' fs/proc/task_mmu.c && \
             ! grep -q '#include <linux/page_size_compat.h>' fs/proc/task_mmu.c; then
            echo "  adding page_size_compat.h include to fs/proc/task_mmu.c"
            sed -i '/#include <linux\/pkeys.h>/a #include <linux\/page_size_compat.h>' fs/proc/task_mmu.c
          fi

          # ------------------------------------------------------------- hard gates
          # No guessing and no auto-repair of rejects: a half-applied SUSFS patch produces a
          # kernel that compiles and boots but silently does nothing useful. Fail here (2 min)
          # instead of after the build + flash (3 h).
          REJS=$(find . -name '*.rej' -not -path './.git/*' | wc -l | tr -dc '0-9')
          echo ".rej files: $REJS"
          if [ "${REJS:-0}" -ne 0 ]; then
            echo "::error::SUSFS patch left $REJS rejects - refusing to build a half-patched SUSFS"
            find . -name '*.rej' -not -path './.git/*' -exec sh -c 'echo "----- {}"; head -40 "{}"' \;
            exit 1
          fi
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            test -f "$f" || { echo "::error::expected SUSFS file $f is missing"; exit 1; }
            echo "OK  $f"
          done
          grep -n 'susfs_init' fs/susfs.c | head -3 || true

          # RUN #7 LESSON (the second compile error): KernelSU-Next's dev-susfs tree calls SUSFS
          # entry points that only exist in newer SUSFS. With an old SUSFS commit pinned the build
          # died 30 minutes in with:
          #   drivers/kernelsu/feature/sucompat.c:199: error: call to undeclared function 'susfs_is_current_proc_no_su'
          #   drivers/kernelsu/feature/sucompat.c:202: error: call to undeclared function 'susfs_set_current_proc_no_su'
          # Both exist in the SUSFS branch TIP's susfs_def.h (verified) but not in 75a61385. So:
          # take every susfs_*() call the KernelSU tree makes and require the SUSFS headers we just
          # installed to declare all of them. One second of work, no long build wasted, and it is
          # not fooled by a version string.
          KSU_TREE="$GITHUB_WORKSPACE/kernel/KernelSU-Next/kernel"
          if [ -d "$KSU_TREE" ]; then
            SYMS=$(grep -rhoE '\bsusfs_[a-z0-9_]+\(' "$KSU_TREE" --include='*.c' --include='*.h' 2>/dev/null \
                   | tr -d '(' | sort -u || true)
            MISSING=""; OURS=""
            for sym in $SYMS; do
              # 1. declared by the SUSFS we just installed?
              if grep -qE "\b${sym}\b" include/linux/susfs.h include/linux/susfs_def.h; then
                continue
              fi
              # 2. provided by the KernelSU fork itself? RUN #8 DIED HERE: dev-susfs carries its own
              #    SUSFS-side helpers - kernel/selinux/selinux.c defines susfs_set_sid(),
              #    susfs_is_sid_equal(), u32 susfs_ksu_sid, ... - and includes ksu.h/selinux.h, NOT
              #    linux/susfs.h. Checking only the SUSFS headers flagged 9 of those as "missing" and
              #    failed run #8 after 50 minutes for no reason. So: a header declaration, or a
              #    definition line in a .c (line starts with a type / static [inline]), also counts.
              if grep -rqE "\b${sym}\b" "$KSU_TREE" --include='*.h' 2>/dev/null \
                 || grep -rqE "^[[:space:]]*(static[[:space:]]+)?(inline[[:space:]]+)?[A-Za-z_][A-Za-z0-9_[:space:]\*]*\b${sym}[[:space:]]*\(" \
                      "$KSU_TREE" --include='*.c' 2>/dev/null; then
                OURS="$OURS $sym"
                continue
              fi
              MISSING="$MISSING $sym"
            done
            NSYM=$(echo $SYMS | wc -w); NOWN=$(echo $OURS | wc -w); NMISS=$(echo $MISSING | wc -w)
            echo "SUSFS calls in KernelSU-Next: ${NSYM}   provided by the fork itself: ${NOWN}   UNRESOLVED: ${NMISS}"
            if [ -n "${MISSING// /}" ]; then
              echo "::error::these susfs_*() calls are declared neither by the installed SUSFS nor by KernelSU-Next:"
              for sym in $MISSING; do
                echo "::error::  $sym   (called from $(grep -rlE "\b${sym}\(" "$KSU_TREE" | head -1))"
              done
              echo "::error::hint: leave susfs_commit empty (branch tip), or pin the KernelSU/SUSFS pair together"
              exit 1
            fi
            echo "OK   every SUSFS call in KernelSU-Next resolves to the installed SUSFS or to the fork itself"
          fi

      # ------------------------------------------------ 6b. heybooboo feature patches
      # PHASE 1 + 2 of the port from asdfmonster261/heybooboo-kernel (branch ksunext-susfs).
      # That is a 6.12.93 tree; ours is pinned to 6.12.69 because that is the sublevel the
      # phone boots and therefore the only CRC-safe choice. So nothing is merged wholesale:
      # every feature is one single-purpose upstream-authored commit, fetched as a .patch
      # from its own commit page and applied with `git apply` (STRICT). Strict is the point:
      # `git apply` tolerates a moved line offset - which is exactly what happens when a
      # stable backport landed between 6.12.69 and 6.12.93 - but refuses altered context. A
      # refusal here costs seconds; the alternative is a kernel that builds fine and is
      # subtly wrong on the phone.
      #
      # Per-patch post-conditions (a patch that "applied" without adding its lines is the one
      # failure mode that would otherwise reach a 2-hour build):
      #   1. every file named in the patch shows up as modified in `git status --porcelain`
      #   2. the tree's added/removed line counts equal the patch's own counts
      #
      # Deliberately NOT in this list:
      #   * their config-only commits (a9521c6909, 62c41a0d4f, 009f068a60, 6c23f6ca52,
      #     dc5d5e9139, 28668bd401, db90629524, b3fc9b5585, 3436321b0a) - all nine edit
      #     arch/arm64/configs/heybooboo_gki.fragment, which does not exist in this tree.
      #     Their content is reproduced verbatim in tuning.config, applied two steps below.
      #   * BORE + PELT x2 + uclamp top-app floor (25578b5b60, 42e178e8e2, d5aa49dd96,
      #     fef16147fc, 27cee96dab, 6c1f29dd0d) - phase 3: the scheduler, gets its own boot test.
      #   * Baseband-guard LSM (ea4b5ea437, 7b9693fbdb, 23baed360e) - phase 4.
      #   * arm64 memcmp/memcpy (4754a780f7, c252209f56) - phase 4: boot-critical code for a
      #     small win, not worth the risk next to BBRv3.
      - name: Features - apply the heybooboo feature patches (phase 1+2)
        if: ${{ inputs.features != 'none' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel/common"
          FEAT_REPO="asdfmonster261/heybooboo-kernel"
          TMP="$(mktemp -d)"
          N=0
          TOTA=0; TOTD=0; TOUCHED=""
          NSKIP=0; SKIPPED=""
          echo "heybooboo phase-1+2 feature patches from $FEAT_REPO"
          echo
          # <sha>|<req|opt>|<extra git-apply args>|<what it is>
          #
          # TIERS, and why they exist (from run #31, which failed here in 9 minutes -
          # exactly what this step is for):
          #   req  a patch the feature *is*. If it does not apply, the kernel would be
          #        wrong rather than merely less hardened, so the run stops.
          #   opt  a hardening/upstream fix. Their tree is 6.12.93 and ours is 6.12.69, so
          #        a hunk can sit on a line that a later stable backport rewrote - that is
          #        what killed d39156040e (fs/binfmt_misc.c:983). Run #30 - the kernel that
          #        boots with root and Wi-Fi - has none of these, so skipping one is safe,
          #        while fuzzing it into place is not. Every skip is printed and summarised.
          while IFS='|' read -r SHA TIER EXCL NOTE; do
            case "$SHA" in ''|'#'*) continue ;; esac
            P="$TMP/$SHA.patch"
            if ! curl -fsSL "https://github.com/$FEAT_REPO/commit/$SHA.patch" -o "$P"; then
              echo "::error::cannot download $FEAT_REPO commit $SHA"
              exit 1
            fi
            SUBJ="$(sed -n 's/^Subject: \[PATCH\] //p' "$P" | head -1)"
            FULL="$(sed -n 's/^From \([0-9a-f]\{40\}\) .*/\1/p' "$P" | head -1)"
            echo "--- $SHA  [$TIER]  $SUBJ"
            echo "      ($NOTE)"
            if ! git apply --check $EXCL "$P" 2>"$TMP/err"; then
              if [ "$TIER" = "req" ]; then
                echo "::error::$SHA is REQUIRED and does not apply cleanly to this 6.12.69 tree"
                sed 's/^/      /' "$TMP/err" | head -30 || true
                echo "::error::forward-port this one by hand - do not fuzz it: a fuzzed hunk lands in the wrong function and still builds"
                exit 1
              fi
              echo "::warning::$SHA is optional and does not apply to 6.12.69 - SKIPPED, not fuzzed"
              sed 's/^/      /' "$TMP/err" | head -12 || true
              NSKIP=$((NSKIP+1)); SKIPPED="$SKIPPED $SHA"
              continue
            fi
            git apply $EXCL "$P"
            for F in $(sed -n 's|^diff --git a/\([^ ]*\) b/.*|\1|p' "$P"); do
              case "$EXCL" in *"$F"*) echo "      (excluded by --exclude: $F)"; continue ;; esac
              if [ -z "$(git status --porcelain -- "$F")" ]; then
                echo "::error::$SHA: $F is not modified - the patch did not do what it claims"
                exit 1
              fi
              TOUCHED="$TOUCHED $F"
            done
            # Line counts: git's own count of what this patch adds, against git's own count
            # of what the tree now has. Two failures were needed to get here, both caught
            # before they could cost a build:
            #   * run #31: grep -c '^+[^+]' skips a bare "+" line, so ntsync read 883 not 1041
            #   * run #33: counting the patch file counts the --exclude'd file too, so the
            #     ntsync patch read +1082 while the tree gained 1081
            # `git apply --numstat` honours --exclude and counts exactly like git does, so the
            # two sides are now the same tool. Accumulated, because the diff is against HEAD.
            read -r PA PD <<EOF
          $(git apply --numstat $EXCL "$P" | awk '{a+=$1; d+=$2} END{print a+0, d+0}')
          EOF
            TOTA=$((TOTA + PA)); TOTD=$((TOTD + PD))
            git add -A -- $TOUCHED
            GOTA="$(git diff --cached --numstat -- $TOUCHED | awk '{a+=$1} END{print a+0}')"
            GOTD="$(git diff --cached --numstat -- $TOUCHED | awk '{d+=$2} END{print d+0}')"
            echo "      lines: this patch +$PA/-$PD   cumulative +$TOTA/-$TOTD   tree now +$GOTA/-$GOTD"
            if [ "$GOTA" != "$TOTA" ] || [ "$GOTD" != "$TOTD" ]; then
              echo "::error::$SHA: the tree does not contain what the patches claim - +$GOTA/-$GOTD present vs +$TOTA/-$TOTD expected"
              exit 1
            fi
            echo "      ok  ($FULL)"
            N=$((N+1))
          done <<'PATCHES'
          912738df5c|req||sched: move sysvipc fields into kABI alignment padding (Droidspaces GKI kABI patch - CONFIG_SYSVIPC in tuning.config depends on it; without it later task_struct offsets move)
          4a540de15a|req||usb: typec: tcpm - register DRP for sink-clobbered dual-role ports (the kernel half of USB-OTG host in recovery/fastbootd; inert on a normal boot)
          cb00795956|req|--exclude=arch/arm64/configs/heybooboo_gki.fragment|misc: ntsync - replace the 6.10 stub with the completed driver (CONFIG_NTSYNC in tuning.config)
          584b8b68ff|req||net: tcp: backport BBRv3 congestion control (13 files, +2682; the new tcp_sock fields sit in a union with __kabi_ignored_0 so tcp_sock keeps its size and offsets)
          # 7bb1c30747 (f2fs: shorten congestion wait to 6ms) is NOT in this list: it is the
          # one required patch that does not fit 6.12.69. mock_apply.py says why in a line -
          # "patch failed: fs/f2fs/f2fs.h:638" - their 6.12.93 tree has MAX_FLUSH_RETRY_COUNT
          # between the anchor lines where 6.12.69 has DEFAULT_RETRY_IO_COUNT and
          # DEFAULT_RETRY_QUOTA_FLUSH_COUNT, so git's context check fails even though the two
          # changed lines are identical. It is hand-ported in the next step (that change is
          # the whole patch: +2/-2).
          08682bf70e|req||f2fs: shorten urgent GC sleep to 50ms
          6fc1453e7d|req||f2fs: raise DEF_MIN_FSYNC_BLOCKS to 20
          0d960a53d0|req||fs: lower default vfs_cache_pressure to 50
          4d105af065|req||lib: inline int_sqrt with a register algorithm (WildKernels kernel_patches; keeps EXPORT_SYMBOL and the signature, so it is CRC-neutral)
          03363983e3|opt||ipc: export init_ipc_ns and put_ipc_ns (only out-of-tree namespace users need it)
          6101595a18|opt||ipc/shm: serialize orphan cleanup with shm_nattch updates
          ba822aad8d|opt||binfmt_misc: don't leak the user namespace when the mount fails
          d39156040e|opt||binfmt_misc: don't warn when the mount is completed from another user namespace (does NOT fit 6.12.69 - see run #31's log: fs/binfmt_misc.c:983)
          5f7b818fd6|opt||binfmt_misc: don't let an 'F' entry pin its own instance
          7551d33223|opt||binfmt_misc: reject a flag character as the field delimiter
          3f8a7dbc0c|opt||binfmt_misc: set have_execfd only once the interpreter is opened

          PATCHES
          echo
          echo "applied $N heybooboo feature patches on top of 6.12.69"
          if [ "$NSKIP" -gt 0 ]; then
            echo "::warning::skipped $NSKIP optional patch(es) that do not fit 6.12.69:$SKIPPED"
            echo "skipped (optional, this tree does not have their 6.12.93 context):$SKIPPED"
          fi
          echo "FEATURES=heybooboo-phase12 applied=$N skipped=${NSKIP}${SKIPPED}" >> "$GITHUB_ENV"
          git diff --stat | tail -3

      # ------------------------------ 6c. the one required patch that needs a hand-port
      # 7bb1c30747 (f2fs: shorten congestion wait to 6ms) is the only required patch that
      # does not apply to this tree, and mock_apply.py says why in one line:
      #     error: patch failed: fs/f2fs/f2fs.h:638
      # Their 6.12.93 tree has MAX_FLUSH_RETRY_COUNT between the anchor lines where 6.12.69
      # has DEFAULT_RETRY_IO_COUNT / DEFAULT_RETRY_QUOTA_FLUSH_COUNT, so git's context check
      # fails even though the two changed lines are byte-identical. Those two lines are the
      # whole patch (+2/-2), so a targeted edit is exact rather than approximate - and it
      # asserts its own pre- and post-conditions either side of the edit.
      #
      # Verified against the real file before being trusted: f2fs_h_6.12.69.h (fetched from
      # android16-6.12.69_r00, sha256 5bea914af9638107...) through f2fs_port_test.sh shows
      # exactly two changed lines and the original tabs intact.
      #
      # The patterns are deliberately tab-free: a literal tab in YAML is a hazard, and \1/\2
      # are followed by letters so they cannot be misread as backreference 16.
      - name: Features - hand-port the f2fs congestion fixup that 6.12.69 moved
        if: ${{ inputs.features != 'none' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel/common"
          F=fs/f2fs/f2fs.h
          b1="$(grep -c 'DEFAULT_IO_TIMEOUT.*msecs_to_jiffies(20)' "$F" || true)"
          b2="$(grep -c 'congestion wait timeout value, default: 20ms' "$F" || true)"
          echo "before: $F  DEFAULT_IO_TIMEOUT@20ms=$b1  comment@20ms=$b2"
          if [ "$b1" != "1" ] || [ "$b2" != "1" ]; then
            echo "::error::expected exactly one of each in $F - this tree is not the one the hand-port was written against"
            grep -n 'DEFAULT_IO_TIMEOUT\|congestion wait timeout' "$F" | head -10 || true
            exit 1
          fi
          sed -i 's|^#define\([[:space:]]*\)DEFAULT_IO_TIMEOUT\([[:space:]]*\)(msecs_to_jiffies(20))|#define\1DEFAULT_IO_TIMEOUT\2(msecs_to_jiffies(6))|' "$F"
          sed -i 's|congestion wait timeout value, default: 20ms|congestion wait timeout value, default: 6ms|' "$F"
          a1="$(grep -c 'DEFAULT_IO_TIMEOUT.*msecs_to_jiffies(20)' "$F" || true)"
          a2="$(grep -c 'DEFAULT_IO_TIMEOUT.*msecs_to_jiffies(6)' "$F" || true)"
          a3="$(grep -c 'congestion wait timeout value, default: 6ms' "$F" || true)"
          echo "after : 20ms=$a1  6ms=$a2  comment-6ms=$a3"
          if [ "$a1" != "0" ] || [ "$a2" != "1" ] || [ "$a3" != "1" ]; then
            echo "::error::the f2fs hand-port did not land exactly once"
            exit 1
          fi
          # Prove the tab survived. printf supplies the tab, so no literal tab is needed
          # anywhere in this file.
          if ! grep -n 'DEFAULT_IO_TIMEOUT.*msecs_to_jiffies(6)' "$F" | grep -q "$(printf 'DEFAULT_IO_TIMEOUT\t')"; then
            echo "::error::the tab before (msecs_to_jiffies(6)) was lost - the define would still work, but it is not the change that was reviewed"
            exit 1
          fi
          echo "ok: f2fs DEFAULT_IO_TIMEOUT 20ms -> 6ms, tabs intact (hand-port of 7bb1c30747)"

      # ------------------------------------------------------- 6d. phase 3: BORE
      # BORE (Burst-Oriented Response Enhancer) plus the PELT 2x multiplier, the uclamp
      # top-app floor and the hard-lock fix that goes with it. Their six commits do NOT
      # apply one at a time to a 6.12.69 GKI tree: the include blocks and one struct member
      # moved between .69 and .93. Four of them do apply, and two reject 5 hunks between
      # them, so the whole phase was rebased into one patch by _kernel_ref/build_phase3.py -
      # which places the rejected hunks with exact-context assertions and then proves the
      # result applies to a clean tree. The patch lives in the repo, so the CI fetches
      # nothing that can drift.
      #
      # BORE keeps its 32-byte per-task state in the four ANDROID_KABI_RESERVE slots
      # (ANDROID_KABI_USE(4..7, u64)) instead of a union - their comment notes a union would
      # "fold to one placeholder in gendwarfksyms and shift task_struct's version hash" - so
      # task_struct neither grows nor moves. The struct-layout gate is what proves that.
      #
      # Deliberately absent, and recorded here so nobody hunts for it: BORE's fair.c tweak
      # inside entity_lag() ("limit >>= 1" under sched_bore_key). 6.12.69 fair.c has
      # update_entity_lag() but no entity_lag() at all - it arrived upstream between .69 and
      # .93 - and guessing at scheduler internals is worse than dropping a tuning detail.
      - name: "Features - phase 3: apply the rebased BORE patch"
        if: ${{ inputs.features == 'phase3' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel/common"
          P="$GITHUB_WORKSPACE/.github/scripts/kodiak/patches/phase3-bore.patch"
          test -f "$P" || { echo "::error::$P is missing - was it published?"; exit 1; }
          echo "applying $(basename "$P")  ($(wc -c < "$P") bytes)"
          if ! git apply --check "$P"; then
            echo "::error::phase3-bore.patch does not apply to this tree"
            git apply --check -v "$P" 2>&1 | head -20 || true
            exit 1
          fi
          git apply "$P"
          # Post-conditions: the two files BORE adds, and the KABI slot edit that keeps it
          # offset-neutral. Without the latter the scheduler would still work and the KMI
          # would be silently wrong.
          for f in kernel/sched/bore.c include/linux/sched/bore.h; do
            test -f "$f" || { echo "::error::$f was not created by the patch"; exit 1; }
          done
          n="$(grep -c 'ANDROID_KABI_USE(4, u64 __bore_q0)' include/linux/sched.h || true)"
          if [ "$n" != "1" ]; then
            echo "::error::BORE's KABI slot edit is missing from include/linux/sched.h (found $n)"
            exit 1
          fi
          n="$(grep -c 'update_curr_bore(task_of(curr), delta_exec)' kernel/sched/fair.c || true)"
          if [ "$n" != "1" ]; then
            echo "::error::BORE's update_curr hook is missing from kernel/sched/fair.c (found $n)"
            exit 1
          fi
          echo "ok: BORE in place (kernel/sched/bore.c, include/linux/sched/bore.h, KABI slots 4-7)"
          git diff --stat | tail -3

      # ---------------------------------------------------------- 6e. NoMount (VFS redirection)
      # NoMount (maxsteeel/nomount) is a VFS path-redirection framework: rather than mounting an
      # overlay, it redirects paths at the VFS layer, so a systemless module's files appear in
      # place without any mount. Its metamodule probes for BUILT-IN kernel support first
      # ("$MODDIR/bin/nm version") and only falls back to a pre-compiled LKM. On a custom kernel
      # neither exists unless the kernel carries it - which is precisely what its
      # "Kernel not patched or module failed to load" description means.
      #
      # Integration is deliberately trivial and touches NO existing source file: their own
      # kernel/setup.sh copies kernel/src/ to fs/nomount/ and adds
      #     fs/Kconfig : source "fs/nomount/Kconfig"
      #     fs/Makefile: obj-$(CONFIG_NOMOUNT) += nomount/
      # so unlike KernelSU/SUSFS/BORE there is nothing here that can conflict with a 6.12.69
      # GKI tree. Their src/Kconfig has no select and no depends, so CONFIG_NOMOUNT=y is the
      # whole config story (see nomount.config, applied two steps below).
      #
      # This is the LKM-vs-built-in distinction their README makes: GKI users can instead drop a
      # pre-compiled nomount.ko into the module's lkm/ folder, but a custom kernel is exactly the
      # case where built-in is the reliable option.
      - name: "NoMount - integrate the VFS path redirection framework"
        if: ${{ inputs.nomount == 'on' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel/common"
          N="$GITHUB_WORKSPACE/nomount"
          rm -rf "$N"
          git clone --depth=1 https://github.com/maxsteeel/nomount "$N"
          if [ -n "${{ inputs.nomount_commit }}" ]; then
            git -C "$N" fetch --depth=1 origin "${{ inputs.nomount_commit }}" 2>/dev/null || true
            if ! git -C "$N" checkout --quiet "${{ inputs.nomount_commit }}" 2>/dev/null; then
              echo "::error::cannot check out NoMount ${{ inputs.nomount_commit }}"
              git -C "$N" log --oneline -3 || true
              exit 1
            fi
            got="$(git -C "$N" rev-parse HEAD)"
            if [ "$got" != "${{ inputs.nomount_commit }}" ]; then
              echo "::error::NoMount HEAD $got does not match the requested pin ${{ inputs.nomount_commit }}"
              exit 1
            fi
            echo "NoMount pinned at $got ($(git -C "$N" log -1 --format=%cs))"
          else
            echo "NoMount at $(git -C "$N" rev-parse HEAD) ($(git -C "$N" log -1 --format=%cs)) - branch tip"
          fi
          echo "NOMOUNT_COMMIT=$(git -C "$N" rev-parse --short HEAD)" >> "$GITHUB_ENV"

          SRC="$N/kernel/src"
          test -f "$SRC/nomount.c" || { echo "::error::$SRC/nomount.c is missing in this NoMount revision"; exit 1; }
          mkdir -p fs/nomount
          cp -f "$SRC"/* fs/nomount/
          ls -la fs/nomount/

          if grep -q 'nomount' fs/Makefile; then
            echo "fs/Makefile already wired"
          else
            printf '\nobj-$(CONFIG_NOMOUNT) += nomount/\n' >> fs/Makefile
            echo "wired fs/Makefile"
          fi
          if grep -q 'source "fs/nomount/Kconfig"' fs/Kconfig; then
            echo "fs/Kconfig already wired"
          else
            awk '/^endmenu/ { last = NR } { l[NR] = $0 } END { for (i = 1; i <= NR; i++) { if (i == last) print "source \"fs/nomount/Kconfig\""; print l[i] } }' fs/Kconfig > fs/Kconfig.tmp && mv fs/Kconfig.tmp fs/Kconfig
            echo "wired fs/Kconfig"
          fi

          # post-conditions: the sources are in place and each wiring line is exactly once
          test -f fs/nomount/nomount.c || { echo "::error::fs/nomount/nomount.c is not in place"; exit 1; }
          test -f fs/nomount/nomount.h || { echo "::error::fs/nomount/nomount.h is not in place"; exit 1; }
          n="$(grep -c 'obj-$(CONFIG_NOMOUNT) += nomount/' fs/Makefile || true)"
          [ "$n" = "1" ] || { echo "::error::fs/Makefile wiring is wrong (found $n)"; exit 1; }
          n="$(grep -c 'source "fs/nomount/Kconfig"' fs/Kconfig || true)"
          [ "$n" = "1" ] || { echo "::error::fs/Kconfig wiring is wrong (found $n)"; exit 1; }
          echo "ok: NoMount integrated (fs/nomount/, fs/Makefile, fs/Kconfig)"

      # ------------------------------------------------------------------- 7. config
      # The canonical list lives in .github/scripts/kodiak/susfs.config (same file the phone-2a
      # pipeline uses) so the options are reviewable in git rather than buried in YAML.
      # CONFIG_KSU=y is NOT "default y" in this fork's Kconfig, and every CONFIG_KSU_SUSFS_*
      # line is only *selectable* because dev-susfs declares it - which the gate above proved.
      - name: Apply the kernel config
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel/common"
          DEFCONFIG="arch/arm64/configs/gki_defconfig"
          PATCHES="${{ inputs.patches }}"

          # Trim with parameter expansion, NOT `xargs`: run #5 died here after applying 11 keys
          # because xargs parses quotes, and this config's header comment contains the literal
          # text  \"strings /vendor/lib/modules/*.ko | grep -m1 vermagic=\"  - that unmatched quote
          # makes xargs exit 1, which `bash -e` turns into a dead step with no error of ours.
          # Only lines that really look like CONFIG_* assignments are applied; the rest is skipped
          # out loud, so prose and device evidence in the file can never break the build again.
          apply_line() {
            local line key value
            line="$1"
            line="${line#"${line%%[![:space:]]*}"}"
            line="${line%"${line##*[![:space:]]}"}"
            [ -z "$line" ] && return 0
            # "# CONFIG_X is not set" is a REAL instruction - it is how kconfig spells "force this
            # off", and it is the only safe way to drop an option the stock defconfig enables.
            # Handle it before the generic comment skip, so commented prose is still skipped.
            if [[ "$line" =~ ^#\ (CONFIG_[A-Za-z0-9_]+)\ is\ not\ set$ ]]; then
              key="${BASH_REMATCH[1]}"; value="n"
            else
              case "$line" in
                \#*) return 0 ;;
                CONFIG_*) ;;
                *) echo "  skip (not an assignment): $line"; return 0 ;;
              esac
              if [[ "$line" == *"="* ]]; then key="${line%%=*}"; value="${line#*=}"; else key="$line"; value="y"; fi
            fi
            # value "n" has to be written the way a defconfig spells it.
            if [ "$value" = "n" ]; then
              if grep -q "^$key=" "$DEFCONFIG"; then
                sed -i "s|^$key=.*|# $key is not set|g" "$DEFCONFIG"
              elif grep -q "^# $key is not set" "$DEFCONFIG"; then
                :
              else
                echo "# $key is not set" >> "$DEFCONFIG"
              fi
              echo "  # $key is not set"
              return 0
            fi
            if grep -q "^$key=" "$DEFCONFIG"; then
              sed -i "s|^$key=.*|$key=$value|g" "$DEFCONFIG"
            elif grep -q "^# $key is not set" "$DEFCONFIG"; then
              sed -i "s|^# $key is not set|$key=$value|g" "$DEFCONFIG"
            else
              echo "$key=$value" >> "$DEFCONFIG"
            fi
            echo "  $key=$value"
            return 0
          }

          if [ "$PATCHES" = "ksu-susfs" ]; then
            echo "--- applying .github/scripts/kodiak/susfs.config ---"
            while IFS= read -r line || [ -n "$line" ]; do
              apply_line "$line" || { echo "::error::could not apply config line: [$line]"; exit 1; }
            done < "$GITHUB_WORKSPACE/.github/scripts/kodiak/susfs.config"
          elif [ "$PATCHES" = "ksun-only" ]; then
            echo "--- KernelSU only (SUSFS deliberately off) ---"
            apply_line "CONFIG_KSU=y"
          else
            echo "--- VANILLA CONTROL: not touching any KSU option ---"
          fi

          # ---------------------------------------------------------------------------
          # MODULE-LOADING COMPATIBILITY - applied to EVERY build, control included, because
          # this is what decides whether the phone's prebuilt vendor modules are accepted.
          # Proven cause of the 2026-10-03 flash where 57 modules never loaded (Wi-Fi gone):
          # the working Wild Kernel sets these and we did not. See the file for the evidence.
          # ---------------------------------------------------------------------------
          echo "--- applying .github/scripts/kodiak/module-compat.config (all builds) ---"
          while IFS= read -r line || [ -n "$line" ]; do
            apply_line "$line" || { echo "::error::could not apply module-compat line: [$line]"; exit 1; }
          done < "$GITHUB_WORKSPACE/.github/scripts/kodiak/module-compat.config"

          # ---------------------------------------------------------------------------
          # FEATURE TUNING - phase 1+2 of the heybooboo port: container namespaces and
          # SysV IPC, ntsync, BBRv3, qdiscs, netfilter/ipset. This file mirrors their
          # arch/arm64/configs/heybooboo_gki.fragment; the *code* half of each feature is
          # applied by the step above, and that order matters: kconfig silently drops a
          # line whose symbol does not exist, so CONFIG_NTSYNC and CONFIG_TCP_CONG_BBR3
          # are inert until their Kconfig entries arrive with the patches.
          #
          # features=none is the control: the kernel of run #30, nothing else.
          # ---------------------------------------------------------------------------
          if [ "${{ inputs.features }}" = "none" ]; then
            echo "--- FEATURE CONTROL: features=none, tuning.config NOT applied (this is run #30) ---"
          else
            echo "--- applying .github/scripts/kodiak/tuning.config (features=${{ inputs.features }}) ---"
            while IFS= read -r line || [ -n "$line" ]; do
              apply_line "$line" || { echo "::error::could not apply tuning line: [$line]"; exit 1; }
            done < "$GITHUB_WORKSPACE/.github/scripts/kodiak/tuning.config"
          fi

          # ---------------------------------------------------------------------------
          # PHASE 3 (BORE): one extra symbol, and it only exists because the previous step
          # applied the rebased BORE patch - which added it to init/Kconfig. Without that
          # patch kconfig drops the line with a warning and the kernel is simply built
          # without BORE, which is why this is its own file rather than a line in
          # tuning.config.
          # ---------------------------------------------------------------------------
          if [ "${{ inputs.features }}" = "phase3" ]; then
            echo "--- applying .github/scripts/kodiak/bore.config (phase 3) ---"
            while IFS= read -r line || [ -n "$line" ]; do
              apply_line "$line" || { echo "::error::could not apply bore line: [$line]"; exit 1; }
            done < "$GITHUB_WORKSPACE/.github/scripts/kodiak/bore.config"
            grep -n '^CONFIG_SCHED_BORE=' "$DEFCONFIG" || echo "::warning::CONFIG_SCHED_BORE did not take in the defconfig"
          fi

          # ---------------------------------------------------------------------------
          # NOMOUNT (independent of features): the symbol only exists because the NoMount
          # step copied fs/nomount/Kconfig into the tree and wired it into fs/Kconfig.
          # ---------------------------------------------------------------------------
          if [ "${{ inputs.nomount }}" = "on" ]; then
            echo "--- applying .github/scripts/kodiak/nomount.config ---"
            while IFS= read -r line || [ -n "$line" ]; do
              apply_line "$line" || { echo "::error::could not apply nomount line: [$line]"; exit 1; }
            done < "$GITHUB_WORKSPACE/.github/scripts/kodiak/nomount.config"
            grep -n '^CONFIG_NOMOUNT=' "$DEFCONFIG" || echo "::warning::CONFIG_NOMOUNT did not take in the defconfig"
          fi
          grep -nE '^CONFIG_MODULE_(ALLOW_BTF_MISMATCH|SCMVERSION)|^# CONFIG_MODULE_SIG_PROTECT is not set' "$DEFCONFIG" || true
          # Report rather than fail: if this ACK tree has no such symbol the line is inert, and
          # that must be visible instead of silent.
          for k in CONFIG_MODULE_ALLOW_BTF_MISMATCH CONFIG_MODULE_SCMVERSION; do
            grep -q "^$k=" "$DEFCONFIG" || echo "::warning::$k did not land - this ACK tree may not have that symbol"
          done
          grep -q '^# CONFIG_MODULE_SIG_PROTECT is not set' "$DEFCONFIG" \
            || echo "::warning::CONFIG_MODULE_SIG_PROTECT was not forced off - check the defconfig"

          # ---------------------------------------------------------------------------
          # MODULE_SIG_PROTECT - the actual cause of the missing modules, fixed by CONTENT.
          # Android protects a list of modules by requiring their signature to verify. Our build
          # trusts its own generated key while every module on the phone is Google-signed, so each
          # module on that list is refused at load. MEASURED after flashing run #25: exactly 58
          # modules never loaded, and they are the whole connectivity stack - cfg80211, mac80211,
          # bcmdhd4390, wonder, bluetooth, btbcm, btqca, btsdio, hci_uart, hidp, nfc, wwan, ppp*,
          # l2tp*, tipc*, 6lowpan, ieee802154*, nhc_*, usbnet, cdc_*, r8152, asix, ax88179_178a,
          # aqc111, mii, slhc, bsd_comp, pppox, pptp, pps_core, ptp, rfkill, bpf, virtio_pci*,
          # libarc4, pwrseq_core, lwis, nitrous, mtk_common, mtk_pcie.
          # Setting CONFIG_MODULE_SIG_PROTECT_LIST="" in the defconfig does NOT work: kconfig
          # ignores an empty string assignment (verified in run #25's built config - it still read
          # "protected_module_names_list"). The LIST FILE is what defines the protected set, so
          # empty that instead, and print what was in it as evidence.
          # ---------------------------------------------------------------------------
          LISTNAME=$(grep -m1 '^CONFIG_MODULE_SIG_PROTECT_LIST=' "$DEFCONFIG" | sed 's/^[^=]*=//' | tr -d '"')
          echo "MODULE_SIG_PROTECT names this list file: [$LISTNAME]"
          if [ -n "$LISTNAME" ]; then
            FOUND=""
            for cand in "$GITHUB_WORKSPACE/kernel/common/$LISTNAME" \
                        "$GITHUB_WORKSPACE/kernel/common/android/$LISTNAME"; do
              if [ -f "$cand" ]; then FOUND="$cand"; break; fi
            done
            if [ -z "$FOUND" ]; then
              FOUND=$(find "$GITHUB_WORKSPACE/kernel" -maxdepth 4 -name "$(basename "$LISTNAME")" \
                        -not -path '*/.git/*' -print -quit 2>/dev/null || true)
            fi
            if [ -n "$FOUND" ]; then
              echo "protected module list found: $FOUND"
              echo "  entries: $(wc -l < "$FOUND") lines, $(wc -c < "$FOUND") bytes"
              echo "---- first 40 (these were being REFUSED at load by our signing key) ----"
              head -40 "$FOUND" || true
              echo "---- end of list ----"
              : > "$FOUND"
              echo "list emptied: now $(wc -c < "$FOUND") bytes -> nothing is signature-protected"
            else
              echo "::warning::protected list '$LISTNAME' not found under kernel/ - the build may generate it"
            fi
          fi

          # ---------------------------------------------------------------------------
          # PROTECTED EXPORTS - the REAL cause of the 58 refused modules. Measured on the device
          # with run #27 (dmesg, read with root): the kernel refuses any module that EXPORTS a
          # symbol on its protected-exports list. Exactly 14 were refused for that reason -
          #   rfkill (rfkill_alloc)        libarc4 (arc4_crypt)      mii (generic_mii_ioctl)
          #   slhc (slhc_compress)         tipc (tipc_dump_done)    pps_core (pps_event)
          #   6lowpan (lowpan_nhc_add)     ieee802154 (wpan_phy_find) l2tp_core (l2tp_recv_common)
          #   wwan (wwan_create_port)      netfs (__traceiter_netfs_sreq)
          #   pwrseq_core (devm_pwrseq_device_register)
          #   virtio_pci_legacy_dev / virtio_pci_modern_dev
          # - and the other 44 (cfg80211, mac80211, bcmdhd4390, wonder, bluetooth, ppp*, ...) are
          # their dependents. No other failure class appears in the kernel log (rust_binder aside).
          #
          # NOTE: setting CONFIG_MODULE_SIG_PROTECT_LIST="" did NOT take (kconfig ignores an empty
          # string), and the earlier module-names approach targeted the wrong list: this one is a
          # list of SYMBOLS. So: find the file that actually carries them (>=3 of the known
          # symbols, so driver sources like net/rfkill/core.c cannot match), SHOW it, and EMPTY it.
          # ---------------------------------------------------------------------------
          # SURGICAL FIX. Run #29 taught the lesson: EMPTYING BUILD INPUTS BREAKS THE BOOT (and its
          # Module.symvers shrank 633 -> 585 KB, i.e. the export set was damaged). The mechanism is
          # explicit in the source:
          #   config MODULE_SIG_PROTECT_LIST  string, default ""          <- empty means OFF
          #   config MODULE_SIG_PROTECT       def_bool y, depends on MODULE_SIG_PROTECT_LIST != ""
          #   kernel/module/main.c, verify_exported_symbols():
          #     #ifdef CONFIG_MODULE_SIG_PROTECT
          #         if (!mod->sig_ok && is_protected_symbol_export(kernel_symbol_name(s))) {
          #             pr_err("%s: exports protected symbol %s\n", ...);
          #             return -EACCES;      <- the refusal the modules hit
          #         }
          #     #endif
          # The build injects the list value (kconfig ignores an empty string in the defconfig, which
          # is why that attempt did nothing), so disable the CONDITION instead - a single-line change
          # that leaves the helper function, its table and the duplicate-symbol check intact, so
          # there is no dead code and no unused-symbol risk.
          MSRC="$GITHUB_WORKSPACE/kernel/common/kernel/module/main.c"
          if [ -f "$MSRC" ]; then
            sed -i 's|if (!mod->sig_ok && is_protected_symbol_export(|if (false \&\& !mod->sig_ok \&\& is_protected_symbol_export(|' "$MSRC"
            DIS=$(grep -c 'if (false && !mod->sig_ok && is_protected_symbol_export(' "$MSRC" || true)
            echo "module/main.c: defused protected-export condition sites = ${DIS:-0}"
            [ "${DIS:-0}" -ge 1 ] || { echo "::error::could not defuse the protected-export check in main.c"; exit 1; }
            grep -n 'exports protected symbol' "$MSRC" | head -3 || true
          else
            echo "::error::$MSRC not found - cannot disable the protected-export refusal"
            exit 1
          fi
          echo "=== files named like protected exports / abi lists (LISTED ONLY - never emptied) ==="
          find "$GITHUB_WORKSPACE/kernel" -maxdepth 6 -type f \
            \( -name '*protected*' -o -name 'abi_gki_*' -o -name 'abi_symbollist*' \) \
            -not -path '*/.git/*' -exec ls -la {} \; 2>/dev/null || true

          echo "=== the code that emits the refusal (patch material if emptying is not enough) ==="
          CODEF="$(grep -rl -F 'exports protected symbol' "$GITHUB_WORKSPACE/kernel/common" 2>/dev/null | head -3 || true)"
          echo "  file(s): ${CODEF:-none found}"
          for cf in $CODEF; do
            echo "  --- $cf ---"
            grep -n -B 8 -A 4 -F 'exports protected symbol' "$cf" || true
          done

          # Persist the evidence to a DEDICATED file: /tmp/config_smoke.log is overwritten by the
          # later "prove the config builds" step, which is how the previous probe's output was lost.
          {
            echo "=== pixel11 protected-exports probe ==="
            echo "list candidates (>=3 known symbols): ${FOUND_LIST:-none}"
            echo "code emitting the refusal: ${CODEF:-none}"
            echo "--- protected/abi files present after the edits ---"
            find "$GITHUB_WORKSPACE/kernel" -maxdepth 6 -type f \
              \( -name '*protected*' -o -name 'abi_gki_*' -o -name 'abi_symbollist*' \) \
              -not -path '*/.git/*' -exec ls -la {} \; 2>/dev/null || true
            echo "--- code context ---"
            for cf in $CODEF; do echo "### $cf"; grep -n -B 8 -A 4 -F 'exports protected symbol' "$cf" || true; done
          } >> /tmp/protect_probe.log 2>&1 || true
          echo "probe written to /tmp/protect_probe.log ($(wc -c < /tmp/protect_probe.log 2>/dev/null || echo 0) bytes)"

          echo "--- KSU/SUSFS lines now in gki_defconfig ---"
          grep -nE '^CONFIG_KSU|^# CONFIG_KSU' "$DEFCONFIG" || echo "(none)"

          if [ "$PATCHES" = "ksu-susfs" ]; then
            grep -qE '^CONFIG_KSU=y' "$DEFCONFIG" || { echo "::error::CONFIG_KSU=y did not land"; exit 1; }
            WANT=$(grep -cE '^CONFIG_KSU_SUSFS' "$GITHUB_WORKSPACE/.github/scripts/kodiak/susfs.config" | tr -dc '0-9')
            GOT=$(grep -cE '^CONFIG_KSU_SUSFS' "$DEFCONFIG" | tr -dc '0-9')
            echo "SUSFS options requested: ${WANT:-0}   present: ${GOT:-0}"
            [ "${GOT:-0}" -ge "${WANT:-1}" ] || { echo "::error::only $GOT of $WANT SUSFS options landed"; exit 1; }
          elif [ "$PATCHES" = "none" ]; then
            # The inverse check: a vanilla control that still carries CONFIG_KSU is not a control.
            if grep -qE '^CONFIG_(KSU|KSU_SUSFS)' "$DEFCONFIG"; then
              echo "::error::patches=none but gki_defconfig carries KernelSU/SUSFS options"
              grep -nE '^CONFIG_(KSU|KSU_SUSFS)' "$DEFCONFIG"; exit 1
            fi
            echo "OK   no CONFIG_KSU* in gki_defconfig (as intended for the control build)"
          fi

      # -------------------------------------------------- 8. get kleaf out of the way
      # We patch gki_defconfig in place, and kleaf's check_defconfig action exists precisely to
      # catch that: it regenerates the config and compares, so it would fail the build for doing
      # the thing we intend to do. `check_defconfig = "disabled"` in common/BUILD.bazel is the
      # documented way to switch it off (the legacy build.sh path is disabled too, for the same
      # reason) - exactly what WildKernels do for their 6.12 kernels.
      - name: Disable kleaf's check_defconfig gate (and prove the config builds)
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          BAZEL=common/BUILD.bazel

          # RUN #6 LESSON: this step used to guard the sed with a *global*
          # `grep -q 'check_defconfig = "disabled"' $BAZEL` - that string exists elsewhere in the
          # file, so the sed never ran, and nothing asserted it. The build then died 7 minutes in
          # with:
          #   ERROR: common/BUILD.bazel:254:14: Creating kernel config (trim) failed
          #   ERROR: savedefconfig does not match common/arch/arm64/configs/gki_defconfig
          # The failing target is //common:kernel_aarch64_config, which kleaf derives from the
          # kernel_build at BUILD.bazel:254 - whose very next line is `name = "kernel_aarch64",`.
          # So: find THAT line, insert there, and assert on that target, not on the whole file.
          L=$(grep -n '^[[:space:]]*name = "kernel_aarch64",' "$BAZEL" | head -1 | cut -d: -f1)
          if [ -z "${L:-}" ]; then
            echo "::error::cannot find the \"kernel_aarch64\" target in $BAZEL"
            grep -n 'kernel_aarch64' "$BAZEL" | head -20 || true
            exit 1
          fi
          echo "kernel_build(kernel_aarch64) name line: $BAZEL:$L"
          if ! sed -n "${L},$((L + 12))p" "$BAZEL" | grep -q 'check_defconfig = "disabled"'; then
            sed -i "${L}a\\    check_defconfig = \"disabled\"," "$BAZEL"
            echo "inserted check_defconfig = \"disabled\" after line $L"
          fi
          if ! sed -n "${L},$((L + 12))p" "$BAZEL" | grep -q 'check_defconfig = "disabled"'; then
            echo '::error::check_defconfig = "disabled" is NOT on the kernel_aarch64 target'
            sed -n "${L},$((L + 12))p" "$BAZEL"
            exit 1
          fi
          echo "--- kernel_aarch64 target header now ---"
          sed -n "${L},$((L + 8))p" "$BAZEL"

          if [ -f common/build.config.gki ]; then
            sed -i 's/check_defconfig//' common/build.config.gki
            echo "build.config.gki: check_defconfig removed (legacy build.sh path, as WildKernels do)"
          fi

          # KernelSU/SUSFS export extra symbols; the ABI protected-exports list can then fail the
          # build for "exporting a protected symbol". Drop the list (same as WildKernels).
          rm -rf common/android/abi_gki_protected_exports_* 2>/dev/null || true
          perl -pi -e 's/^\s*"protected_exports_list"\s*:\s*"android\/abi_gki_protected_exports_aarch64",\s*$//;' "$BAZEL" || true

          # Prove the config target builds NOW (minutes) instead of discovering it inside the
          # 2-hour build - and warm the Bazel cache with the exact flags the real build uses.
          echo "--- config-only smoke test: //common:kernel_aarch64_config ---"
          mkdir -p /home/runner/.cache/bazel
          if tools/bazel build --config=fast --config=stamp --disk_cache=/home/runner/.cache/bazel \
               //common:kernel_aarch64_config 2>&1 | tee /tmp/config_smoke.log; then
            echo "OK   kleaf accepted the patched gki_defconfig (check_defconfig is off)"
          else
            echo "::error::config-only build failed - check_defconfig is still active, or the options are bad"
            grep -nE 'ERROR|error:|savedefconfig' /tmp/config_smoke.log | tail -25 || true
            exit 1
          fi

      # ------------------------------------------------------------ 9. clean the release
      # With --config=stamp kleaf derives UTS_RELEASE from SCM - that is what we want - but it
      # exports LOCALVERSION="-maybe-dirty" whenever the tree is dirty, and common/scripts/
      # setlocalversion adds "-dirty" of its own. On the phone-2a pipeline that produced
      #     5.15.197-...-maybe-dirty
      # where stock said "...-ab15063902". The suffix lands in the vermagic and in the string the
      # device and attestation see, so kill it at the source; then commit the edits so the tree
      # is clean as well (belt and braces) and assert both.
      - name: Kill -dirty / -maybe-dirty at the source
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          echo "--- stamp.bzl before ---"
          grep -n 'stable_scmversion_cmd' build/kernel/kleaf/impl/stamp.bzl || true
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" build/kernel/kleaf/impl/stamp.bzl
          sed -i 's/-dirty//' common/scripts/setlocalversion

          # ---------------------------------------------------------------------------------------
          # FORCE THE EXACT UTS_RELEASE (why the stock vendor modules read
          #   6.12.69-android16-6-g6a49175400c0-ab16238327-4k   while run #15's kernel read
          #   6.12.69-android16-6-4k )
          #
          # kleaf composes the release as <VERSION.PATCHLEVEL.SUBLEVEL> + <localversion> + <SCM
          # version> + <page size>. The SCM half is sourced by stamp.bzl, which on a runner cannot
          # determine it at all ("Unable to execute repo manifest -r: ... 'repo'") and therefore
          # falls back to the literal '-maybe-dirty' - which is what my sed above neuters, leaving
          # the -g<hash> and -ab<build> tokens missing.
          #
          # The whole string funnels through common/scripts/setlocalversion (the Makefile's
          # filechk_kernel.release calls it), so forcing that script plus the stamp.bzl fallback
          # pins the release exactly. Asserted here, before a 20-minute build, not after.
          # ---------------------------------------------------------------------------------------
          # EVIDENCE FIRST: print how this tree composes the release, and what the pristine script
          # emits, so the next run's log is self-explanatory instead of guesswork.
          echo "--- how the release is composed (evidence) ---"
          grep -n 'filechk_kernel.release' -A2 common/Makefile | head -8 || true
          grep -n 'KERNELVERSION\|LOCALVERSION' build/kernel/kleaf/impl/*.bzl 2>/dev/null | head -16 || true
          cp common/scripts/setlocalversion /tmp/setlocalversion.orig 2>/dev/null || true
          if [ -f /tmp/setlocalversion.orig ]; then
            echo "pristine setlocalversion emits: '$(sh /tmp/setlocalversion.orig "$GITHUB_WORKSPACE/kernel/common" 2>/dev/null || true)'"
          fi

          # --- force the build timestamp: the OTHER half of the banner (uname -v) -----------------
          # stamp.bzl's _set_source_date_epoch falls back to `export SOURCE_DATE_EPOCH=0` whenever the
          # stable status is unavailable - which it is on a runner (no repo tool) - so our banner read
          #   #1 SMP PREEMPT Thu Jan  1 00:00:00 UTC 1970
          # while stock reads
          #   #1 SMP PREEMPT Fri Jul 10 21:44:24 UTC 2026
          # Patch that fallback, and export KBUILD_BUILD_TIMESTAMP too (the kernel honours it above
          # SOURCE_DATE_EPOCH). Asserted below and again post-build from the artifact.
          STOCK_TS="${{ inputs.expected_build_timestamp }}"
          if [ -n "$STOCK_TS" ]; then
            EPOCH=$(date -u -d "$STOCK_TS" +%s 2>/dev/null || date -u -d "${STOCK_TS#* }" +%s)
            echo "expected banner timestamp: '$STOCK_TS'  -> epoch $EPOCH"
            echo "--- SOURCE_DATE_EPOCH lines in stamp.bzl (before) ---"
            grep -n 'SOURCE_DATE_EPOCH' build/kernel/kleaf/impl/stamp.bzl || true
            sed -i "s|export SOURCE_DATE_EPOCH=0|export SOURCE_DATE_EPOCH=${EPOCH}|" build/kernel/kleaf/impl/stamp.bzl
            grep -q "export SOURCE_DATE_EPOCH=${EPOCH}" build/kernel/kleaf/impl/stamp.bzl \
              || { echo "::error::could not patch the SOURCE_DATE_EPOCH fallback in stamp.bzl"; grep -n 'SOURCE_DATE_EPOCH' build/kernel/kleaf/impl/stamp.bzl || true; exit 1; }
            echo "SOURCE_DATE_EPOCH=$EPOCH" >> "$GITHUB_ENV"
            echo "KBUILD_BUILD_TIMESTAMP=$STOCK_TS" >> "$GITHUB_ENV"
            echo "OK   timestamp pinned to the stock value"
          else
            echo "expected_build_timestamp empty - timestamp left to kleaf"
          fi

          # RUN #18 LESSON: patching stamp.bzl alone was NOT enough - the banner still read
          # "#1 SMP PREEMPT Thu Jan  1 00:00:00 UTC 1970", because the SOURCE_DATE_EPOCH that actually
          # reaches the compiler is resolved further down the stack (kleaf's _setup_env.sh, then the
          # kernel's own scripts/mkcompile_h). mkcompile_h is the script that literally writes
          # include/generated/compile.h, whose UTS_VERSION carries the banner timestamp, so setting the
          # variables at the TOP of that script wins regardless of what the environment says - the same
          # trick that already fixed the release string in setlocalversion. _setup_env.sh and the
          # KLEAF_SOURCE_DATE_EPOCHS branch get the same treatment as belts, each asserted.
          if [ -n "$STOCK_TS" ]; then
            MK=common/scripts/mkcompile_h
            if [ -f "$MK" ]; then
              echo "--- $MK timestamp/date logic (before) ---"
              grep -nE 'TIMESTAMP|SOURCE_DATE_EPOCH|date ' "$MK" || true
              if ! grep -q 'CI: forced build timestamp' "$MK"; then
                sed -i "2i KBUILD_BUILD_TIMESTAMP=\"$STOCK_TS\"; SOURCE_DATE_EPOCH=$EPOCH; export KBUILD_BUILD_TIMESTAMP SOURCE_DATE_EPOCH   # CI: forced build timestamp" "$MK"
              fi
              grep -q 'CI: forced build timestamp' "$MK" || { echo "::error::could not force the timestamp in $MK"; exit 1; }
              echo "OK   $MK forces the timestamp at its top"
            else
              echo "::warning::$MK not found"
            fi
            for ENVF in build/kernel/_setup_env.sh build/_setup_env.sh; do
              if [ -f "$ENVF" ]; then
                echo "--- $ENVF timestamp logic (before) ---"
                grep -nE 'SOURCE_DATE_EPOCH|KBUILD_BUILD_TIMESTAMP' "$ENVF" || true
                if ! grep -q 'CI: forced build timestamp' "$ENVF"; then
                  sed -i "1i export KBUILD_BUILD_TIMESTAMP=\"$STOCK_TS\"; export SOURCE_DATE_EPOCH=$EPOCH   # CI: forced build timestamp" "$ENVF"
                fi
                grep -q 'CI: forced build timestamp' "$ENVF" && echo "OK   $ENVF also forces the timestamp"
              fi
            done
            if grep -q 'KLEAF_SOURCE_DATE_EPOCHS=' build/kernel/kleaf/impl/stamp.bzl; then
              sed -i "s|^\(\s*\)export KLEAF_SOURCE_DATE_EPOCHS=.*|&\n\1export SOURCE_DATE_EPOCH=$EPOCH|" build/kernel/kleaf/impl/stamp.bzl
              grep -q "export SOURCE_DATE_EPOCH=$EPOCH" build/kernel/kleaf/impl/stamp.bzl \
                && echo "OK   stamp.bzl exports SOURCE_DATE_EPOCH=$EPOCH too" \
                || echo "::warning::could not append the SOURCE_DATE_EPOCH export in stamp.bzl"
            fi
          fi

          EXPECT="${{ inputs.expected_uts_release }}"
          if [ -n "$EXPECT" ]; then
            # RUN #16 LESSON: emitting only the suffix produced a kernel whose banner read
            #   Linux version -android16-6-g6a49175400c0-ab16238327-4k
            # i.e. whatever this script prints becomes the ENTIRE release - no version is prepended
            # on this tree. So emit the complete expected string.
            echo "expected UTS_RELEASE : $EXPECT"
            grep -q 'CI: forced release' common/scripts/setlocalversion || \
              sed -i "2i echo \"${EXPECT}\"; exit 0   # CI: forced release" common/scripts/setlocalversion
            sed -i "s|^stable_scmversion_cmd = \"echo ''\"|stable_scmversion_cmd = \"echo '${EXPECT}'\"|" \
              build/kernel/kleaf/impl/stamp.bzl
            ABN=$(printf '%s' "$EXPECT" | sed -n 's/.*-ab\([0-9]\+\).*/\1/p')
            if [ -n "$ABN" ]; then echo "BUILD_NUMBER=$ABN" >> "$GITHUB_ENV"; echo "pinned BUILD_NUMBER=$ABN"; fi
            echo "--- common/scripts/setlocalversion, first 3 lines ---"
            head -3 common/scripts/setlocalversion
            GOT="$(sh common/scripts/setlocalversion "$GITHUB_WORKSPACE/kernel/common" 2>/dev/null || true)"
            echo "forced setlocalversion emits: '$GOT'"
            [ "$GOT" = "$EXPECT" ] || { echo "::error::setlocalversion emitted '$GOT', expected '$EXPECT'"; exit 1; }

            # CHEAP PROOF (RUN #16 LESSON): re-run kleaf's config-only target - about a minute - and
            # read the kernel.release it regenerates, instead of discovering the string 20 minutes
            # into the build. syncconfig runs filechk_kernel.release, so this is the real value.
            echo "--- regenerating the config so kernel.release reflects the forced string ---"
            if tools/bazel build --config=fast --config=stamp --disk_cache=/home/runner/.cache/bazel \
                 //common:kernel_aarch64_config >/tmp/config_verify.log 2>&1; then
              echo "config target rebuilt OK"
            else
              echo "::warning::config rebuild failed - see the tail below; step 14 will also check"
              tail -20 /tmp/config_verify.log || true
            fi
            KR=$(find "$GITHUB_WORKSPACE/kernel/out" -name kernel.release -print -quit 2>/dev/null || true)
            if [ -n "$KR" ]; then
              RELEASE=$(cat "$KR")
              echo "kernel.release at $KR says: '$RELEASE'"
              if [ "$RELEASE" != "$EXPECT" ]; then
                echo "::error::this tree will build '$RELEASE', not '$EXPECT' - fix the forcing before the 20-minute build"
                exit 1
              fi
              echo "OK   kernel.release exactly matches the device's stock release"
            else
              echo "::warning::no kernel.release found under out/ - relying on step 14's post-build gate"
            fi
            echo "OK   release string pinned to the device's stock value"
          else
            echo "expected_uts_release empty - release string left to kleaf"
          fi
          echo "--- stamp.bzl after ---"
          grep -n 'stable_scmversion_cmd' build/kernel/kleaf/impl/stamp.bzl || true
          echo "--- stamp.bzl after ---"
          grep -n 'stable_scmversion_cmd' build/kernel/kleaf/impl/stamp.bzl || true

          git -C common add -A
          git -C common -c user.name="pixel11-kernel-ci" -c user.email="ci@localhost" \
              commit -q -m "pixel11-ci: gki_defconfig (KSU/SUSFS) + clean dirty flag" --no-verify \
              || echo "(nothing to commit)"
          echo "common HEAD: $(git -C common rev-parse --short HEAD)"

          if grep -rqI -- '-maybe-dirty' build/kernel/kleaf/impl/stamp.bzl common/scripts/setlocalversion 2>/dev/null; then
            echo "::error::-maybe-dirty survives - the release string would not match the branch"
            grep -rnI -- '-maybe-dirty' build/kernel/kleaf/impl/stamp.bzl common/scripts/setlocalversion
            exit 1
          fi
          echo "OK   no -maybe-dirty / -dirty left in the SCM version machinery"

      # -------------------------------------------------------------------- 10. build
      # //common:kernel_aarch64/Image is the whole boot.img payload - the 128 vendor modules are
      # prebuilt on the device and load by KMI, so a full kernel_aarch64_dist (every GKI module,
      # tens of GB, hours) is wasted here. Image.lz4 comes from the same invocation: it is the
      # compressed form the Pixel boot image actually stores.
      - name: kleaf build (Image + Image.lz4)
        timeout-minutes: 150
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          mkdir -p /home/runner/.cache/bazel

          # Capture the WHOLE step - the build AND the post-build checks. RUN #10 LESSON: teeing only
          # the bazel line hid the real failure. The build had actually SUCCEEDED
          #   INFO: Build completed successfully, 24 total actions
          #   -- KernelSU-Next version: 33312  -- KernelSU-Next tag: v3.4.0  -- SUSFS_VERSION: v2.3.0
          # and the step still exited 2 further down, because kleaf keeps its convenience symlinks under
          # out/ (its output base is out/bazel/...), so `ls bazel-bin/...` referenced a missing path and
          # ls exits 2. That exit code was the only trace; now the whole step lands in the file.
          exec > >(tee /tmp/build.log) 2>&1

          set +e
          tools/bazel build \
            --config=fast \
            --config=stamp \
            --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image \
            //common:kernel_aarch64/Image.lz4
          RC=$?
          set -e
          echo "bazel exit code: $RC"
          test "$RC" -eq 0 || exit "$RC"

          # Find where kleaf actually put the outputs and recreate the plain `bazel-bin` symlink that the
          # later steps (bypass / Verify / boot.img / Package) all assume. Never fail on a path guess.
          KB="$GITHUB_WORKSPACE/kernel/bazel-bin"
          if [ ! -f "$KB/common/kernel_aarch64/Image" ]; then
            for cand in "$GITHUB_WORKSPACE/kernel/out/bazel-bin" "$GITHUB_WORKSPACE/kernel/out"; do
              if [ -f "$cand/common/kernel_aarch64/Image" ]; then
                echo "kleaf put the outputs in $cand"
                if [ ! -e "$KB" ]; then ln -s "$cand" "$KB"; echo "created bazel-bin -> $cand"; fi
                break
              fi
            done
          fi
          K="$KB/common/kernel_aarch64"
          if [ ! -f "$K/Image" ]; then
            echo "================= built outputs ================="
            echo "-- symlinks at the workspace root --"
            ls -la "$GITHUB_WORKSPACE/kernel" | grep -E 'bazel-bin|bazel-out|^l' || true
            echo "-- searching out/ for Image / Image.lz4 --"
            find "$GITHUB_WORKSPACE/kernel/out" -maxdepth 7 \( -name 'Image' -o -name 'Image.lz4' \) 2>/dev/null | head -20 || true
            echo "::error::build succeeded but Image is not at $K (full log is uploaded as an artifact)"
            exit 1
          fi
          echo "================= built outputs ($K) ================="
          # No `| head` here: RUN #13 LESSON - `ls ... | head -30` gives ls a broken pipe, ls exits 2
          # and with `set -o pipefail` + `bash -e` that aborts the step after a SUCCESSFUL build. The
          # listing is a dozen lines, so print it whole.
          ls -la "$K" || true
          for f in Image Image.lz4; do
            test -s "$K/$f" || { echo "::error::$K/$f missing or empty"; exit 1; }
            echo "OK   $f: $(stat -c%s "$K/$f") bytes"
          done
          echo "--- release string carried by the Image ---"
          strings "$K/Image" | grep -m1 '^Linux version ' || true
          echo "KLEAF_OUTDIR=$K" >> "$GITHUB_ENV"
          # GATE: the WHOLE banner must match stock - /proc/version and uname -a read it, i.e. the
          # release plus the compiler string plus "#1 SMP PREEMPT" plus the build timestamp. Step 13
          # forced the release and the timestamp; this verifies the artifact really carries them. The
          # compiler string, kleaf@build-host, #1 and SMP PREEMPT already match stock by construction
          # (same pinned clang, same config), so the comparison below is the complete banner.
          BANNER=$(strings "$K/Image" | grep -m1 '^Linux version ' || true)
          echo "BANNER: $BANNER"
          echo "UTS_RELEASE=$(printf '%s' "$BANNER" | awk '{print $3}')" >> "$GITHUB_ENV"
          EXPECT="${{ inputs.expected_uts_release }}"
          if [ -n "$EXPECT" ]; then
            GOTREL=$(printf '%s' "$BANNER" | awk '{print $3}')
            echo "release : '$GOTREL'"
            echo "expected: '$EXPECT'"
            if [ "$GOTREL" != "$EXPECT" ]; then
              echo "::error::UTS_RELEASE mismatch - the Image reports '$GOTREL', expected '$EXPECT'"
              exit 1
            fi
            echo "OK   UTS_RELEASE matches the stock value exactly"
          fi
          EXPECT_TS="${{ inputs.expected_build_timestamp }}"
          if [ -n "$EXPECT_TS" ]; then
            if printf '%s' "$BANNER" | grep -qF "$EXPECT_TS"; then
              echo "OK   banner timestamp matches stock ('$EXPECT_TS')"
            else
              echo "::error::banner timestamp mismatch - expected '$EXPECT_TS' in: $BANNER"
              exit 1
            fi
          fi
          echo "--- full banner comparison ---"
          echo "built: $BANNER"
          echo "stock: Linux version ${EXPECT:-?} (kleaf@build-host) (Android (14043575, +pgo, +bolt, +lto, +mlgo, based on r536225) clang version 19.0.1 (https://android.googlesource.com/toolchain/llvm-project b3a530ec6537146650e42be89f1089e9a3588460), LLD 19.0.1) #1 SMP PREEMPT ${EXPECT_TS:-?}"

      # Optional second kernel: neuter the module-version check so the kernel accepts modules
      # whose CRCs do not match (kernel/module/version.c, bad_version: -> return 1). Only built
      # when the input asks for it - an escape hatch, not the normal path.
      # RUN #9 LESSON: the run's log archive came back as a 25KB stub (0_build.txt + system.txt), so a
      # 20-minute compile failure left no readable trace - the only evidence was the check-run
      # annotation "Process completed with exit code 2". Capture the build log and upload it ALWAYS,
      # so a failure is diagnosable no matter how GitHub truncates the job log.
      - name: Upload the build log (always)
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}-build-log
          path: |
            /tmp/build.log
            /tmp/config_smoke.log
            /tmp/protect_probe.log
          if-no-files-found: ignore
          compression-level: 9

      - name: kleaf build - module-version bypass Image (optional)
        if: ${{ inputs.bypass_module_versions }}
        timeout-minutes: 150
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          T=common/kernel/module/version.c
          test -f "$T" || { echo "::error::$T not found - the bypass hack needs the 6.12 module split"; exit 1; }
          sed -i '/bad_version:/{:a;n;/return 0;/{s/return 0;/return 1;/;b};ba}' "$T"
          grep -A5 'bad_version:' "$T" | grep -q 'return 1;' || { echo "::error::bypass patch did not take"; exit 1; }
          tools/bazel build --config=fast --config=stamp --disk_cache=/home/runner/.cache/bazel \
            //common:kernel_aarch64/Image
          mkdir -p bypass
          cp bazel-bin/common/kernel_aarch64/Image bypass/Bypass-Image
          ls -la bypass/

      # ------------------------------------------------------------- 11. verify the Image
      # Gates that answer "is this actually the kernel we think we built", using only the
      # artifact itself - the same checks the phone-2a pipeline learned to insist on.
      - name: Verify the built Image
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          bash "$GITHUB_WORKSPACE/.github/scripts/kodiak/verify_kernel_image.sh" \
            "bazel-bin/common/kernel_aarch64/Image" \
            "6.12.${{ inputs.expected_sublevel }}-android16-" \
            "${{ inputs.patches }}"

      # ---------------------------------------------- 12. optional boot.img (fastboot)
      # MEASURED, not inferred. Google's factory image for this exact build
      # (kodiak-cd1a.260905.001.b1) gives the ground truth for a stock boot.img:
      #     header_version 4, header_size 1584, kernel_size 20230712, ramdisk_size 0,
      #     os_version 0 (yes: ZERO), os_version patch level 0, cmdline "", signature_size 0
      # while the stock **init_boot.img** from the same image carries os_version 0x220001a9
      # (Android 17.0.0, patch 2026-09) and ramdisk_size 2667913. Android puts the version in
      # init_boot and leaves boot alone - which is why dumping init_boot (an earlier draft of this
      # file did exactly that) pointed at the wrong value.
      #
      # .github/boot-template/kodiak/stock-header.bin is the first 4 KB of the factory image's
      # boot.img, so verify_boot_img.py compares our header against Google's byte-for-byte.
      # kodiak-init_boot-header.bin is kept beside it purely so the difference is visible.
      #
      # AVB: the stock header has signature_size 0 and no footer in the header itself; boot_img=avb
      # adds an avbtool hash footer with a generated test key, sized to the real 64 MiB partition.
      - name: Build boot.img (optional)
        if: ${{ inputs.boot_img != 'none' }}
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          K="bazel-bin/common/kernel_aarch64"
          test -f "$K/Image.lz4" || { echo "::error::$K/Image.lz4 missing - build first"; exit 1; }

          # mkbootimg.py, unpack_bootimg.py and avbtool all live in this one AOSP repo.
          if [ ! -d "$GITHUB_WORKSPACE/mkbootimg" ]; then
            git clone --depth=1 https://android.googlesource.com/platform/system/tools/mkbootimg "$GITHUB_WORKSPACE/mkbootimg"
          fi
          MK="$GITHUB_WORKSPACE/mkbootimg"
          ls "$MK" | head -20 || true

          BOOT="$GITHUB_WORKSPACE/boot.img"
          rm -f "$BOOT"
          # Header v4, empty cmdline, no ramdisk, and - measured against Google's own factory image,
          # not inferred - **no os_version**: stock kodiak boot.img carries os_version 0 and patch
          # level 0, while stock init_boot.img carries 17.0.0 / 2026-09. So the flags are only passed
          # if someone deliberately sets the inputs, and the verifier compares the result against
          # .github/boot-template/kodiak/stock-header.bin either way.
          # Google's stock boot.img stores the kernel as an lz4 *legacy* frame - first bytes 02 21 4c 18.
          # That is what the bootloader decompresses, so a gzip or raw payload in a header-v4 image
          # would flash successfully and then fail to boot. Gate it here (seconds) instead of at the
          # phone (bricked boot).
          MAGIC=$(od -An -tx1 -j0 -N4 "$K/Image.lz4" | tr -d ' \n')
          echo "Image.lz4 magic: ${MAGIC:-<empty>}   (stock boot.img kernel magic: 02214c18)"
          case "$MAGIC" in
            02214c18) echo "OK   lz4 legacy - identical format to stock" ;;
            04224d18) echo "::warning::lz4 *frame* format: bootloaders expect the legacy form (02214c18) - prefer flashing via AnyKernel3, which recompresses on-device" ;;
            *)        echo "::error::$K/Image.lz4 is not lz4 (magic ${MAGIC:-<empty>}) - a boot.img built from it would not boot"; exit 1 ;;
          esac

          OS_ARGS=()
          # NOTE: written as if/fi, not `[ -n ... ] && ...`, because GitHub runs run: blocks with
          # `bash -e` and a failing test would abort the step - which is exactly what happens on the
          # default (empty) inputs.
          if [ -n "${{ inputs.bootimg_os_version }}" ]; then
            OS_ARGS+=(--os_version "${{ inputs.bootimg_os_version }}")
          fi
          if [ -n "${{ inputs.bootimg_os_patch_level }}" ]; then
            OS_ARGS+=(--os_patch_level "${{ inputs.bootimg_os_patch_level }}")
          fi
          if [ "${#OS_ARGS[@]}" -eq 0 ]; then
            echo "mkbootimg header args: none (reproduces Google's factory boot.img header)"
          else
            echo "mkbootimg header args: ${OS_ARGS[*]}  <- deviates from stock; the verifier will judge"
          fi

          python3 "$MK/mkbootimg.py" \
            --header_version 4 \
            --kernel "$K/Image.lz4" \
            "${OS_ARGS[@]}" \
            --output "$BOOT"
          ls -la "$BOOT"

          if [ "${{ inputs.boot_img }}" = "avb" ]; then
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 \
              -out "$GITHUB_WORKSPACE/testkey_rsa2048.pem" 2>/dev/null
            python3 "$MK/avbtool" add_hash_footer \
              --partition_name boot \
              --partition_size ${{ inputs.avb_partition_size }} \
              --image "$BOOT" \
              --algorithm SHA256_RSA2048 \
              --key "$GITHUB_WORKSPACE/testkey_rsa2048.pem"
            echo "--- avbtool info_image ---"
            python3 "$MK/avbtool" info_image --image "$BOOT" | head -25 || true
          fi

          echo "--- what AOSP's own tool makes of the result ---"
          python3 "$MK/unpack_bootimg.py" --boot_img "$BOOT" --out "$GITHUB_WORKSPACE/unpacked_boot" || true

          echo "--- header compared against the Google-authored reference (stock init_boot_a) ---"
          python3 "$GITHUB_WORKSPACE/.github/scripts/kodiak/verify_boot_img.py" \
            "$BOOT" "$GITHUB_WORKSPACE/.github/boot-template/kodiak/stock-header.bin"

          SIZE=$(stat -c %s "$BOOT")
          LIMIT=${{ inputs.avb_partition_size }}
          echo "boot.img size: $SIZE bytes (boot partition: $LIMIT)"
          if [ "$SIZE" -gt "$LIMIT" ]; then
            echo "::error::boot.img ($SIZE) is larger than the boot partition ($LIMIT) - fastboot would refuse it"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp "$BOOT" "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-boot.img"
          ls -la "$GITHUB_WORKSPACE/artifacts"

      # -------------------------------------------------------- 13. package AnyKernel3
      # Why AnyKernel3 instead of a hand-built boot.img: the Pixel boot header carries the OS
      # version / patch level / AVB hash footer, and AK3 does the repack ON THE PHONE from the
      # LIVE boot partition with magiskboot - so the header, the ramdisk and the AVB metadata are
      # preserved exactly, no test keys, no 64MB partition-size guessing, and it refuses non-6.12
      # kernels. This is also how the Wild Kernel currently on the phone gets flashed.
      - name: Package AnyKernel3 zip
        run: |
          set -o pipefail
          FILE_NAME="${FILE_NAME:?FILE_NAME is not set - did the timestamp step run?}"

          A="$GITHUB_WORKSPACE/AnyKernel3"
          rm -rf "$A"
          git clone --depth=1 https://github.com/WildKernels/AnyKernel3.git -b gki-2.0 "$A"

          # Their GKI zip ships do.devicecheck=0, i.e. it would cheerfully flash this kernel to
          # ANY GKI device. This repo only ever builds for kodiak, so turn the check ON and name
          # the device - a wrong flash (real risk with one phone and two identical-looking zips)
          # then aborts instead of bootlooping.
          sed -i 's/^do.devicecheck=0$/do.devicecheck=1/' "$A/anykernel.sh"
          sed -i 's/^device.name1=$/device.name1=kodiak/'    "$A/anykernel.sh"
          grep -nE '^do.devicecheck|^device\.name1|^block=' "$A/anykernel.sh"

          K="$GITHUB_WORKSPACE/kernel/bazel-bin/common/kernel_aarch64"
          cp "$K/Image"     "$A/Image"
          cp "$K/Image.lz4" "$A/Image.lz4"
          if [ -f "$GITHUB_WORKSPACE/kernel/bypass/Bypass-Image" ]; then
            cp "$GITHUB_WORKSPACE/kernel/bypass/Bypass-Image" "$A/Bypass-Image"
          fi
          ls -la "$A" | head -25 || true

          # ---------------------------------------------------------------------------------
          # SHIP THE MATCHING KERNELSU USERSPACE (RUN #24-#26 LESSON).
          # Our kernel reports KernelSU-Next 33318 (v3.4.0) while the phone carries
          # ksud 3.3.0-41-g39ba3821, so the kernel's version handshake fails and `su` never
          # appears: root was inert in every flash. Without root, the kernel's module-refusal
          # messages (dmesg) are unreadable - which is exactly what blocked the module diagnosis.
          # WildKernels' AK3 solves this by shipping the userspace; ours only shipped the Image.
          # So: fetch the pinned manager APK, verify it by SHA256, lift ksud out of it (the APK
          # embeds it as lib/arm64-v8a/libksud.so) and have anykernel.sh install it to
          # /data/adb/ksud at flash time, because the AK3 runs as root inside the flasher.
          # ---------------------------------------------------------------------------------
          KSU_APK_URL="https://github.com/KernelSU-Next/KernelSU-Next/releases/download/v3.4.0/KernelSU_Next_v3.4.0_33294-release.apk"
          KSU_APK_SHA="50339A93C0F812B8A72C1A387A1B441891E3DF0F20B2D9DAF80FD798D04B3DE8"
          KSUD_SHA="C305965796AFB55AE8DAD3A122935C995A818E07C637A9EF4C3E375202E4A427"
          curl -LSs -o /tmp/ksu-manager.apk "$KSU_APK_URL"
          GOT=$(sha256sum /tmp/ksu-manager.apk | awk '{print toupper($1)}')
          if [ "$GOT" != "$KSU_APK_SHA" ]; then
            echo "::error::manager APK hash mismatch: got $GOT want $KSU_APK_SHA"
            exit 1
          fi
          echo "manager APK verified: $GOT"
          unzip -o -j /tmp/ksu-manager.apk 'lib/arm64-v8a/libksud.so' -d /tmp >/dev/null
          mv /tmp/libksud.so "$A/ksud"
          chmod 0755 "$A/ksud"
          KSUD_GOT=$(sha256sum "$A/ksud" | awk '{print toupper($1)}')
          if [ "$KSUD_GOT" != "$KSUD_SHA" ]; then
            echo "::error::extracted ksud hash mismatch: got $KSUD_GOT want $KSUD_SHA"
            exit 1
          fi
          echo "ksud verified: $KSUD_GOT  ($(stat -c%s "$A/ksud") bytes)"
          file "$A/ksud" || true

          # Install it during the flash. The fragment is PREPENDED to anykernel.sh right after its
          # shebang so it always runs before the AK3 flow and cannot be skipped by an early exit.
          # It lives in .github/scripts/kodiak/ksu-install.sh rather than inline here: shell code
          # inside a YAML block scalar must be indented, and a flush-left heredoc body silently
          # terminates the scalar (that broke this workflow once already).
          KSI="$GITHUB_WORKSPACE/.github/scripts/kodiak/ksu-install.sh"
          test -f "$KSI" || { echo "::error::$KSI missing - cannot install the KSU userspace"; exit 1; }
          head -1 "$A/anykernel.sh"    > /tmp/ak-new.sh
          cat "$KSI"                  >> /tmp/ak-new.sh
          tail -n +2 "$A/anykernel.sh" >> /tmp/ak-new.sh
          mv /tmp/ak-new.sh "$A/anykernel.sh"
          chmod 0755 "$A/anykernel.sh"
          grep -q 'pixel11 CI ksud install' "$A/anykernel.sh" \
            || { echo "::error::ksud install block did not land in anykernel.sh"; exit 1; }
          echo "anykernel.sh patched; first 4 lines:"; head -4 "$A/anykernel.sh" || true
          ls -la "$A/ksud" "$A/anykernel.sh"

          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          ( cd "$A" && zip -r -9 "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-AnyKernel3.zip" . -x '.git/*' -x '.git' >/dev/null )
          cp "$K/Image"     "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-Image"
          cp "$K/Image.lz4" "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-Image.lz4"

          # ---------------------------------------------------------------------------------------
          # BENCH GATE PAYLOAD - why these two files are in the artifact set.
          # The phone runs CONFIG_MODVERSIONS=y, so every prebuilt module records the CRC it expects
          # for EVERY kernel symbol it imports and the kernel must match it exactly or the module is
          # refused ("disagrees about version of symbol ... Unknown symbol (err -22)"). On the
          # 2026-10-03 flash a dev-susfs-tip kernel left cfg80211/bcmdhd4383/bcmdhd4390 unloadable:
          # 369 modules on the Wild Kernel, 312 on ours - dead Wi-Fi and a degraded modem stack.
          # Module.symvers is the kernel's side of that contract, so crc_gate.py can diff it against
          # the .ko files pulled off the phone BEFORE anything is flashed. The .config is included so
          # a CRC surprise can be traced to a config difference instead of guessed at.
          # kleaf/ACK emit the CRC table under either name - Module.symvers when the build
          # produced modules, vmlinux.symvers when it only linked vmlinux (our Image-only build).
          # Same format ('0x<crc>\t<symbol>\t<provider>'), so crc_gate.py reads either.
          SYMV="$(find "$GITHUB_WORKSPACE/kernel" -name 'Module.symvers' -path '*kernel_aarch64*' -print -quit 2>/dev/null || true)"
          if [ -z "$SYMV" ]; then
            SYMV="$(find "$GITHUB_WORKSPACE/kernel" -name 'vmlinux.symvers' -print -quit 2>/dev/null || true)"
          fi
          if [ -z "$SYMV" ]; then
            SYMV="$(find "$GITHUB_WORKSPACE/kernel" -name '*symvers' -print -quit 2>/dev/null || true)"
          fi
          if [ -n "$SYMV" ]; then
            echo "CRC table: $SYMV"
            cp "$SYMV" "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-Module.symvers"
            echo "exported symbol CRCs in it: $(wc -l < "$SYMV")"
          else
            echo "::warning::no *symvers file found anywhere under kernel/ - the bench CRC gate cannot run on this build"
            find "$GITHUB_WORKSPACE/kernel" -maxdepth 4 -name 'vmlinux*' 2>/dev/null | head -5 || true
          fi
          if [ -f "$K/.config" ]; then
            cp "$K/.config" "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-kernel.config"
          else
            echo "(no $K/.config to upload - skipping)"
          fi
          ls -la "$GITHUB_WORKSPACE/artifacts"

      # --------------------------------------------- 11b. struct-layout gate input
      # The struct-layout gate needs BTF from *this* build. vmlinux is ~500 MB and .BTF
      # is not SHF_ALLOC, so it never reaches Image/Image.lz4 - hence objcopy-ing just
      # that section here: a few MB, uploads fine, and it is the only thing that can
      # answer the question a CRC check cannot, namely "did a struct member move?".
      # The gate itself runs locally, before flashing:
      #   python btf_structs.py diff _kernel_ref/btf_baseline_run30.vmlinux <name>-BTF
      - name: Extract the .BTF section (struct-layout gate input)
        run: |
          set -o pipefail
          cd "$GITHUB_WORKSPACE/kernel"
          VM="bazel-bin/common/kernel_aarch64/vmlinux"
          if [ ! -f "$VM" ]; then
            echo "::error::$VM not found - the struct-layout gate cannot run without it"
            find bazel-bin -maxdepth 4 -name 'vmlinux*' 2>/dev/null | head -10 || true
            exit 1
          fi
          # Extract .BTF with python3, not objcopy. Run #34 proved why: the host
          # /usr/bin/objcopy is x86 binutils and answers "Unable to recognise the format of
          # the input file" for an aarch64 ELF, and llvm-objcopy is not in PATH on the
          # runner (it lives in kleaf's downloaded clang prebuilts). Reading the ELF
          # section table directly is 12 lines, needs no toolchain, and cannot drift.
          python3 - "$VM" "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-BTF" <<'PY'
          import struct, sys
          src, dst = sys.argv[1], sys.argv[2]
          data = open(src, 'rb').read()
          if data[:4] != b'\x7fELF' or data[4] != 2 or data[5] != 1:
              sys.exit('not a 64-bit little-endian ELF: ' + src)
          shoff, = struct.unpack_from('<Q', data, 0x28)
          shentsize, shnum, shstrndx = struct.unpack_from('<HHH', data, 0x3A)
          stroff, strsize = struct.unpack_from('<QQ', data, shoff + shstrndx * shentsize + 0x18)
          strtab = data[stroff:stroff + strsize]
          for i in range(shnum):
              base = shoff + i * shentsize
              name_off, = struct.unpack_from('<I', data, base)
              off, size = struct.unpack_from('<QQ', data, base + 0x18)
              name = strtab[name_off:strtab.find(b'\0', name_off)].decode('utf-8', 'replace')
              if name == '.BTF':
                  open(dst, 'wb').write(data[off:off + size])
                  print('wrote %s: %d bytes' % (dst, size))
                  break
          else:
              sys.exit('no .BTF section in ' + src)
          PY
          ls -la "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-BTF"
          # A BTF blob starts with the magic 0xEB9F, little-endian: 9f eb
          MAGIC="$(od -An -tx1 -N2 "$GITHUB_WORKSPACE/artifacts/${FILE_NAME}-BTF" | tr -d ' \n')"
          if [ "$MAGIC" != "9feb" ]; then
            echo "::error::${FILE_NAME}-BTF does not start with the BTF magic (got '$MAGIC')"
            exit 1
          fi
          echo "BTF magic OK - feed this file to: python btf_structs.py diff <baseline> <this file>"

      - name: Upload artifacts
        # RUN #34 LESSON: this had no `always()`, so when the .BTF step failed the whole
        # build (Image, Image.lz4, boot.img and the AnyKernel3 zip - 28 minutes of it) was
        # thrown away with it. A late gate must never be able to discard a good build.
        if: ${{ always() && hashFiles('artifacts/*') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE_NAME }}
          path: |
            artifacts/*
          if-no-files-found: error
          compression-level: 0

      # The summary is the thing you actually read at 2am when the flash goes wrong.
      - name: Run summary
        if: ${{ always() }}
        run: |
          # Fallback: if the run died before the first step exported a name, do not print empty
          # artifact names (run #1 did, and the summary looked broken).
          FILE_NAME="${FILE_NAME:-kodiak-build-did-not-get-far-enough-to-name-artifacts}"
          {
            echo "## kodiak GKI kernel - ${{ inputs.patches }}"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Device | Pixel 11 Pro XL (**kodiak**, Tensor G6) |"
            echo "| Features | \\`${{ inputs.features }}\\` (heybooboo port phase 1+2 = container namespaces/SysV IPC, binfmt fixes, ntsync, BBRv3, f2fs/vfs/int_sqrt, tcpm DRP \\`none\\` = run #30) |"
            echo "| ACK branch | \`${{ inputs.kernel_branch }}\` |"
            echo "| KMI | android16-6.12 (sublevel ${{ inputs.expected_sublevel }}) |"
            echo "| Device patch level | ${{ inputs.os_patch_level }} |"
            echo "| KernelSU-Next | \`${{ inputs.ksu_branch }}\` @ ${KSU_COMMIT:-${{ env.KSU_COMMIT }}} (v${{ env.KSU_VERSION }}, ${{ env.KSU_GIT_TAG }}) |"
            echo "| SUSFS | \`${{ inputs.susfs_branch }}\` @ ${SUSFS_COMMIT:-n/a} ${SUSFS_DATE:-} (${{ env.SUSFS_VERSION }}) |"
            echo "| Artifact | \`${{ env.FILE_NAME }}-AnyKernel3.zip\` (+ \`-Image\`, \`-Image.lz4\`) |"
            if [ -f "$GITHUB_WORKSPACE/artifacts/${{ env.FILE_NAME }}-boot.img" ]; then
              echo "| boot.img | \`${{ env.FILE_NAME }}-boot.img\` (mode \`${{ inputs.boot_img }}\`, header checked against the Google-authored init_boot reference) |"
            fi
            echo
            echo "### Flashing (keep the phone rooted and backed up)"
            echo "0. **BENCH GATE FIRST - this is the step that failed on 2026-10-03.** \`python crc_gate.py --symvers ${FILE_NAME}-Module.symvers --modules <pulled device module dir>\`: every module imported by the phone must find its EXACT symbol CRC in our Module.symvers. If it cannot, that module will be refused at load and take its subsystem down (Wi-Fi = cfg80211 + bcmdhd4383/4390). Do not flash on a red gate."
            echo "0b. **STRUCT-LAYOUT GATE - new with features=heybooboo-phase12.** The feature set adds fields to struct task_struct (CONFIG_SYSVIPC, relocated into the kABI padding by patch 912738df5c) and to struct tcp_sock (BBRv3, wrapped in a union with __kabi_ignored_0). Both are *designed* to leave offsets alone, and a CRC check cannot see a moved field offset - it only sees declaration changes. So diff this run's vmlinux against the run #30 baseline: \`python btf_structs.py diff _kernel_ref/btf_baseline_run30.vmlinux <this run's vmlinux>\`. A moved offset in a struct a vendor module touches is a no-flash, and the fix is to drop that one config (CONFIG_SYSVIPC/IPC_NS) rather than to hope."
            echo "0c. **What run #35 measured (so you know what is expected, not suspicious).** task_struct 5184->5184, tcp_sock 2432->2432, nsproxy 72->72, sock 840->840, cred 184->184, sk_buff 248->248, sched_entity 320->320, all with **0 moved offsets**; task_struct gains only the sysvsem/sysvshm unions at +164/+172 (the 32-byte pad before se at +192), tcp_sock only BBRv3's unioned bitfields. Two expected residuals: (a) \`tcp_bbr_info\`/\`tcp_cc_info\` 20->52 - UAPI inet_diag structs, enlarged by upstream's own BBRv3 so \`ss\` can report it, and no kernel module imports UAPI structs by CRC; (b) \`rate_sample\` 72->88 and \`bictcp\` - TCP-internal, and BBRv3's include/net/tcp.h hunks add members to enum tcp_ca_event / tcp_ca_ack_event_flags, which is why eight exported TCP symbols (tcp_poll, tcp_done, tcp_sendmsg_locked, tcp_read_sock, tcp_recv_skb, tcp_read_done, tcp_sock_set_cork, tcp_sock_set_nodelay) changed CRC. Verified offline: **no module on this device imports any of those eight** (tcp_crc_probe.py), so nothing can be refused because of them."
            echo "1. \`adb shell su -c \"dd if=/dev/block/by-name/boot_a of=/sdcard/boot_a-pre-ci.img\"\` - always have the current boot image."
            echo "2. Install **${{ env.FILE_NAME }}-AnyKernel3.zip** with KernelFlasher (or any AK3 flasher). It repacks the LIVE boot partition, keeps the header/AVB fields and refuses non-6.12 kernels."
            echo "3. Reboot, then run the verification checklist in the repo README."
            if [ -f "$GITHUB_WORKSPACE/artifacts/${{ env.FILE_NAME }}-boot.img" ]; then
              echo "4. No flasher app, or the phone only reaches fastboot: \`fastboot flash boot ${{ env.FILE_NAME }}-boot.img\`. That image is header v4 with an empty cmdline and \`ramdisk_size 0\` - the stock layout, checked against the dump."
            fi
            echo
            echo "### Manual route, if you cannot use a flasher"
            echo "\`\`\`"
            echo "adb push ${{ env.FILE_NAME }}-Image.lz4 /data/local/tmp/"
            echo "adb shell su -c 'cd /data/local/tmp && magiskboot unpack /dev/block/by-name/boot_a && cp Image.lz4 kernel && magiskboot repack /dev/block/by-name/boot_a new-boot.img && dd if=new-boot.img of=/dev/block/by-name/boot_a'"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"









