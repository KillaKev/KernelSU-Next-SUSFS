name: Build GKI kernel (KernelSU-Next + SUSFS) - Nothing Phone 2a / pacman

# Target: Nothing Phone 2a (pacman), NothingOS 4 build 2608130941
# Kernel: 5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902  (GKI, KMI android13-5.15)
#
# SOURCE CHOICE IS CRITICAL: only android13-5.15-2026-03 is v5.15.197 (verified by reading
# each KMI-generation branch's Makefile). Building the same KMI generation is what keeps the
# symbol CRCs identical so the 235 prebuilt /vendor/lib/modules still load
# (the device has CONFIG_MODVERSIONS=y).
#
# Note on vermagic: with CONFIG_MODVERSIONS=y the kernel compares only the flag part of the
# vermagic (it skips the version token - see same_magic(..., has_crcs=true)), so the CRCs are
# the real gate. We still pin the version for cleanliness.

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next (SUSFS fork) branch/tag - MUST be a SUSFS-carrying branch such as dev-susfs; plain upstream dev has no SUSFS'
        required: true
        default: 'dev-susfs'
      susfs_branch:
        description: 'susfs4ksu branch - 5.15 options: gki-android13-5.15 (stable) / gki-android13-5.15-dev (latest)'
        required: true
        default: 'gki-android13-5.15-dev'
      build_target:
        description: 'Bazel target to build. //common:kernel_aarch64_dist builds the kernel PLUS every GKI module and the whole dist dir (tens of GB, the long pole). //common:kernel_aarch64 builds just the kernel Image + Image.lz4 - which is all boot.img needs, since the 235 vendor modules are prebuilt on-device and load by KMI.'
        required: true
        default: '//common:kernel_aarch64'


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ---------------------------------------------------------------- workspace + disk
      # FAILED RUN #1 LESSON: "System.IO.IOException: No space left on device:
      #   /home/runner/actions-runner/cached/.../_diag/Worker_....log"
      # That killed the RUNNER ITSELF at 1m44s: the runner's own logs live on /, and the
      # stock ubuntu-latest image leaves / nearly full. So: free space first, then pick
      # whichever mount actually has room, and fail loudly if neither does.
      - name: Free disk space and choose the build mount
        run: |
          echo "================= BEFORE ================="
          df -h / /mnt 2>/dev/null || df -h

          # Aggressive, transparent space reclaim (no third-party action). This mirrors the list
          # WildKernels get from endersonmenezes/free-disk-space@v4 - on an ubuntu-latest runner
          # DISK is the resource that runs out, and the kernel build is very hungry.
          # /opt/hostedtoolcache is listed explicitly as well as via $AGENT_TOOLSDIRECTORY, because
          # relying on the variable alone does nothing at all if it happens to be unset.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm /usr/local/lib/node_modules \
                      /opt/az /usr/share/miniconda /usr/local/.ghcup \
                      /usr/lib/google-cloud-sdk /usr/local/share/chromium \
                      /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli \
                      /usr/local/aws-sam-cli /usr/share/gradle /usr/lib/mono \
                      /usr/share/java /opt/microsoft /usr/local/graalvm \
                      "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          # RUN #11 LESSON - THE WATCHDOG SHOWED THE "MEMORY, NOT DISK" CASE: PUT SWAP BACK.
          # This step used to only REMOVE the stock swap (copying WildKernels' remove_swap: true) and
          # never add any back, on the reasoning that --config=fast needs less room than their
          # LTO=thin. Run #11's streamed samples proved that reasoning wrong - memory climbed steadily
          # into the kernel compile and the runner died while it was still climbing:
          #     17:29:23Z mem_used=3878MB mem_avail=4058MB swap_used=0MB
          #     17:30:23Z mem_used=4175MB mem_avail=3761MB swap_used=0MB
          #     17:31:23Z mem_used=4628MB mem_avail=3309MB swap_used=0MB   <- killed 55 s later
          # (used + avail ~ 7.9GB, so this is an 8 GB runner - and swap_used=0 means the safety net
          # had been deleted, not that it was unused.) The failure signature is the runner service
          # stopping, which is what an OOM-killed agent looks like:
          #     ##[error]The runner has received a shutdown signal. This can happen when the runner
          #     service is stopped, or a manually started runner is canceled.
          # WildKernels add 16 GB back for their LTO=thin builds; 8 GB is ample at this memory
          # profile and still leaves ~47 GB of disk for a build whose peak stayed under 30 GB.
          # (The stock swap is still removed first so the size is known and deterministic.)
          echo "============ swap: BEFORE (stock, about to be replaced) ============"
          free -m | tail -2
          swapon --show 2>/dev/null || true
          sudo swapoff -a >/dev/null 2>&1 || true
          sudo rm -f /swapfile /mnt/swapfile >/dev/null 2>&1 || true
          sudo fallocate -l 16G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=16384 status=none
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile >/dev/null
          sudo swapon /swapfile
          # swappiness 10 keeps RAM for page cache while the build runs; the swap is a safety net for
          # the end-of-kernel-action spike (the vmlinux link), not a working area.
          sudo sysctl -w vm.swappiness=10 >/dev/null
          echo "============ swap: AFTER (8 GB safety net) ============"
          free -m | tail -2
          swapon --show 2>/dev/null || true
          sudo apt-get clean >/dev/null 2>&1 || true

          echo "================= AFTER ================="
          df -h / /mnt 2>/dev/null || df -h

          # pick the mount with the most free space (numbers only, in GB)
          A=$(df -BG --output=avail / 2>/dev/null | tail -1 | tr -dc '0-9'); A=${A:-0}
          B=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9'); B=${B:-0}
          echo "/ has ${A}GB   /mnt has ${B}GB   (need ~40GB)"

          if [ "$B" -gt "$A" ] && [ "$B" -ge 40 ]; then
            WD=/mnt/kernel_workspace
          elif [ "$A" -ge 40 ]; then
            WD="$HOME/kernel_workspace"
          else
            echo "::error::Not enough disk space (${A}GB on /, ${B}GB on /mnt). Need ~40GB."
            df -h
            exit 1
          fi
          mkdir -p "$WD"
          echo "WORKDIR=$WD" >> "$GITHUB_ENV"
          echo "chosen WORKDIR = $WD"
          df -h "$WD"


      # check out this repo so the helper scripts under .github/scripts are available
      - uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@localhost"
          git config --global user.name  "kernel-ci"
          git config --global color.ui false

      # ---------------------------------------------------------------- sync
      # RUN #10 LESSON - THE SHALLOW-SYNC TRICK DOES NOT TRANSFER TO OUR REPO TOOL.
      # WildKernels' download-kernel action syncs shallowly:
      #     repo init --depth=1 ...  ;  repo sync -c --current-branch --no-clone-bundle -j4 --jobs-checkout=4
      # Copying that here failed in 3 seconds, and the run's own log says exactly why:
      #     repo has been initialized in /home/runner/kernel_workspace   <- repo init --depth=1 was FINE
      #     Usage: repo sync [<project>...]
      #     main.py: error: no such option: --depth                     <- but repo SYNC has no --depth
      # --depth is a `repo init` option in the current repo tool, not a `repo sync` option. Even from
      # init it is not safe to flip blindly: repo gates shallow cloning behind the REPO_ALLOW_SHALLOW
      # environment variable (the constant is read in both subcmds/init.py and subcmds/sync.py), so
      # keeping it would be one more guess - and every guess costs a full dispatch.
      #
      # We also do not need it. Run #10's watchdog - the first run to stream a sample - measured
      #     free=45GB  mem_used=2369MB mem_avail=5569MB swap_used=0MB
      # at build start WITH a full sync, and an Image-only build needs nowhere near 45 GB. Disk was
      # never the binding constraint by itself; building every GKI module was. So this step is now
      # byte-for-byte what the known-good runs #7/#8/#9 used - only the build target differs - which
      # keeps one variable at a time and makes any next failure unambiguous.
      - name: repo init + sync ACK android13-5.15-2026-03 (v5.15.197)
        run: |
          cd "$WORKDIR"
          set -e
          echo "disk before sync:"; df -h "$WORKDIR" | tail -1
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android13-5.15-2026-03
          repo sync -j8 --no-tags --current-branch
          echo "disk after sync:"; df -h "$WORKDIR" | tail -1
          du -sh "$WORKDIR"

      - name: Verify source kernel version is exactly 5.15.197
        run: |
          cd "$WORKDIR"
          set -e

          # RUN #16 LESSON - BUILD THE TREE THE STOCK KERNEL CAME FROM, NOT THE BRANCH TIP.
          # The stock device reports 5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902, and in a
          # `git describe` string the trailing sha is HEAD - so Google built it from commit
          # 2d8ad9139b89. Our `repo init -b <branch>` takes the branch TIP, and the config diff proved
          # the two trees differ: CONFIG_ARM64_ERRATUM_4118414 is y in ours and absent from stock. A
          # different source tree means different exported-symbol CRCs, so the vendor modules can
          # refuse to load no matter how the build is configured. Pin it, and refuse to build if the
          # commit cannot be resolved - a mismatched tree is worse than no build.
          RELEASE_SHA=2d8ad9139b89
          echo "============ pinning common/ to the stock release commit ============"
          echo "target : $RELEASE_SHA  (from the stock release string)"
          echo "before : $(git -C common rev-parse HEAD)  ($(git -C common rev-parse --abbrev-ref HEAD))"
          if ! SHA=$(git -C common rev-parse --verify "${RELEASE_SHA}^{commit}" 2>/dev/null); then
            echo "::error::cannot resolve $RELEASE_SHA in common/ - refusing to build an unmatched tree"
            echo "hint: the release commit may predate the branch point we fetched"
            exit 1
          fi
          echo "resolved: $SHA"
          git -C common checkout --detach "$SHA"
          echo "after  : $(git -C common rev-parse HEAD)"
          echo "subject: $(git -C common log -1 --pretty=%s)"

          KV=$(awk '/^VERSION =/{a=$3} /^PATCHLEVEL =/{b=$3} /^SUBLEVEL =/{c=$3} END{print a"."b"."c}' common/Makefile)
          echo "source version: $KV"
          echo "device version: 5.15.197"
          test "$KV" = "5.15.197"

          # RUN #9 LESSON - DO NOT DELETE .repo. It was added to reclaim space and it BROKE THE BUILD:
          #     ERROR: common/BUILD.bazel:54:22: Building kernel kernel_aarch64 failed: (Exit 23)
          #     symlink has no referent: ".../out__common_kernel_aarch64/android13-5.15/common/source/.git"
          #     rsync error: some files/attrs were not transferred (code 23)
          # In a repo-managed checkout each project's .git is only a POINTER into .repo/projects/...
          # (alternates point at .repo/project-objects/...), so removing .repo leaves common/.git
          # dangling and kleaf's rsync into the action sandbox fails within seconds. The space is won
          # the right way instead: the kernel-only build target below skips the whole GKI module tree,
          # which is tens of GB and was the real hog - see the free=45GB sample in the sync comment.
          # Just record the sizes here.
          echo "============ disk + .repo size (keep .repo - see comment) ============"
          df -h "$WORKDIR" | tail -1
          du -sh "$WORKDIR/.repo" 2>/dev/null || true

          # RUN #13 LESSON - PIN THE SCM VERSION IN THE FILE THE TOOLING RESPECTS.
          # Two independent pieces of the pinned kleaf/ACK read this file instead of running git:
          #   kleaf stamp rule - "Save scmversion to .scmversion if .scmversion does not already
          #                      exist. If it does exist, then it is part of srcs, so respect its
          #                      value."
          #   scripts/setlocalversion - "if test -e .scmversion; then cat .scmversion; return"
          # The stock device reports 5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902, whose parts
          # are: base 5.15.197 | scm -android13-8-00005-g2d8ad9139b89 | -ab15063902 (BUILD_NUMBER,
          # appended by setlocalversion from the branch's build config). Pinning the middle part here
          # makes the release deterministic and identical to stock even if git's describe would
          # disagree. NOTE: no trailing newline - it would end up inside the version string.
          # Keep EXPECT_REL identical to EXPECT in the inspect step.
          EXPECT_REL=5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902
          # RUN #20 LESSON - the -ab<BUILD_NUMBER> tail must be supplied HERE, not left to the build.
          # With --config=stamp kleaf takes the version from this file, and the ACK's setlocalversion
          # only appends `-ab${BUILD_NUMBER}` when BUILD_NUMBER is exported - Google's build sets it
          # (15063902 is the platform build number in the device's own release string) and ours does
          # not. Without it, run #20 produced 5.15.197-android13-8-00005-g2d8ad9139b89 and the
          # assertion below correctly refused it. Supplying the value in this file keeps the release -
          # and therefore the vermagic - identical to stock, while leaving CONFIG_LOCALVERSION="" and
          # CONFIG_LOCALVERSION_AUTO=y exactly as the stock config has them.
          SCM_PART=${EXPECT_REL#5.15.197}     # -android13-8-00005-g2d8ad9139b89-ab15063902
          echo "common/.scmversion before: $(cat common/.scmversion 2>/dev/null || echo '<absent>')"
          printf '%s' "$SCM_PART" > common/.scmversion
          echo "common/.scmversion after:  $(cat common/.scmversion)"
          echo "target release string:     $EXPECT_REL"

      # ---------------------------------------------------------------- KernelSU-Next
      # RUN #7 FIX - WHY THIS NOW USES pershoot's FORK, NOT UPSTREAM KernelSU-Next.
      #
      # Runs #3-#6 all got through this step and died at the config/link stage. The reason
      # was NOT check_defconfig alone: upstream KernelSU-Next ships NO SUSFS, and
      # simonpunk's kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch is written for
      # UPSTREAM KernelSU (tiann). Against KernelSU-Next it rejects ~10 hunks and leaves
      # these symbols UNDEFINED, while the kernel-side patch's fs/exec.c + input.c call them
      # under CONFIG_KSU_SUSFS=y - i.e. a guaranteed link failure ~2 h in:
      #     ksu_handle_execveat(int *fd, struct filename **, void*, void*, int*)
      #     ksu_handle_post_execveat_sucompat(int *fd, ...)
      #     ksu_handle_input_handle_event(unsigned int*, unsigned int*, int*)
      #     ksu_is_input_hook_enabled, ksu_su_compat_enabled
      #
      # WildKernels - who build exactly our target (their config lists sublevel 197 /
      # date 2026-03 for android13-5.15) - state it outright in .github/actions/susfs:
      #   root_flavor 'kernelsu' -> apply 10_enable_susfs_for_ksu.patch
      #   "other flavors already ship SUSFS" / "pershoot dev-susfs (next) ... no-op"
      # and they resolve the KernelSU-Next root from
      #   https://github.com/pershoot/KernelSU-Next.git refs/heads/dev-susfs
      #
      # VERIFIED LOCALLY (sparse clone of pershoot/KernelSU-Next dev-susfs): it defines
      # every symbol above with the correct NEW signatures -
      #   feature/sucompat.c:289  ksu_handle_execveat(int *fd, struct filename **, ...)
      #   feature/sucompat.c:277  ksu_handle_post_execveat_sucompat(int *fd, ...)
      #   runtime/ksud_integration.c:563  ksu_handle_input_handle_event(...)
      #   runtime/ksud_integration.c:36   DEFINE_STATIC_KEY_TRUE(ksu_is_input_hook_enabled)
      #   policy/allowlist.c:287  __ksu_is_allow_uid_for_current(uid_t)
      #   feature/sucompat.c:53   DEFINE_STATIC_KEY_TRUE(ksu_su_compat_enabled)
      #   core/init.c:106         susfs_init()
      # The new-signature sucompat variants sit inside #ifdef CONFIG_KSU_SUSFS (the old
      # (const char __user **, int, pt_regs*) ones are the #else branch), so enabling SUSFS
      # selects them - no duplicate-definition collision.
      # The 17 susfs_* helpers dev-susfs calls that simonpunk's headers do NOT declare are
      # pershoot's OWN selinux/selinux.c symbols (susfs_set_sid, susfs_is_sid_equal, ...),
      # so there is no gap in either direction.
      #
      # setup.sh from pershoot's fork already hardcodes OWNER="pershoot" and performs the
      # drivers/kernelsu symlink + Kconfig/Makefile wiring itself, so this stays a one-line
      # change to the source and NOTHING else about the integration mechanism changes.
      - name: Integrate KernelSU-Next + SUSFS (${{ inputs.ksu_branch }})
        run: |
          cd "$WORKDIR/common"
          set -e
          curl -LSs "https://raw.githubusercontent.com/pershoot/KernelSU-Next/${{ inputs.ksu_branch }}/kernel/setup.sh" \
            | bash -s "${{ inputs.ksu_branch }}"
          test -e drivers/kernelsu
          echo "--- drivers/Makefile tail ---"; tail -3 drivers/Makefile
          echo "--- drivers/Kconfig tail ---";  tail -3 drivers/Kconfig

          echo "============ is this really a SUSFS-carrying KernelSU-Next? ============"
          echo "KernelSU-Next HEAD: $(git -C "$WORKDIR/common/KernelSU-Next" rev-parse HEAD 2>/dev/null || echo unknown)"
          echo "KernelSU-Next ref:  $(git -C "$WORKDIR/common/KernelSU-Next" describe --tags --always 2>/dev/null || echo unknown)"
          KSUSUSFS=$(grep -c 'KSU_SUSFS' "$WORKDIR/common/KernelSU-Next/kernel/Kconfig" 2>/dev/null | tr -dc '0-9')
          echo "KSU_SUSFS options declared in KernelSU-Next/kernel/Kconfig: ${KSUSUSFS:-0}"
          if [ "${KSUSUSFS:-0}" -eq 0 ]; then
            echo "::error::This KernelSU-Next checkout carries NO SUSFS. ksu_branch must be a SUSFS branch (dev-susfs). Upstream 'dev' has no SUSFS and the build would fail to link ~2 h in."
            exit 1
          fi
          # the symbols the kernel-side patch links against must exist HERE, not later
          for sym in ksu_handle_execveat ksu_handle_post_execveat_sucompat ksu_handle_input_handle_event ksu_is_input_hook_enabled susfs_init; do
            if grep -rqE "\b${sym}\b" "$WORKDIR/common/KernelSU-Next/kernel" 2>/dev/null; then
              echo "OK      KernelSU-Next defines/references ${sym}"
            else
              echo "::error::KernelSU-Next does not provide ${sym}, which the SUSFS kernel-side patch calls under CONFIG_KSU_SUSFS=y - the build WOULD fail at link."
              exit 1
            fi
          done
          echo "OK - KernelSU-Next carries SUSFS and exports the API the kernel patch needs"

      # ---------------------------------------------------------------- SUSFS
      # RUN #2 LESSON: the OFFICIAL procedure (susfs4ksu README) is THREE parts, not one:
      #   1. copy the SUSFS source files in (kernel_patches/fs/*, include/linux/*)
      #   2. apply the KernelSU-side patch (10_enable_susfs_for_ksu.patch)
      #   3. apply the kernel-side patch (50_add_susfs_in_gki-android13-5.15.patch)
      # I only did part 3, so fs/susfs.c never existed for the hooks to call into.
      # The README also says: "if there are failed patches, you may try to patch them
      # manually by yourself" — our KMI revision (2026-03) is newer than the one the SUSFS
      # branch was cut from, so a couple of include-block hunks reject. Tolerate + repair.
      - name: Apply SUSFS (full 3-part procedure)
        run: |
          cd "$WORKDIR"
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          S=/tmp/susfs4ksu/kernel_patches
          echo "--- patch tree ---"
          find "$S" -maxdepth 2 -type f | sort

          echo "--- (1) copying SUSFS source files ---"
          cp -v "$S"/fs/*            "$WORKDIR/common/fs/"
          cp -v "$S"/include/linux/* "$WORKDIR/common/include/linux/"

          # (2) KernelSU-side patch: NOT APPLIED ANY MORE - RUN #7 FIX.
          #
          # simonpunk's kernel_patches/KernelSU/10_enable_susfs_for_ksu.patch exists to bolt
          # SUSFS onto UPSTREAM KernelSU (tiann), which does not have it. Against
          # KernelSU-Next it rejects ~10 hunks (kernel/Kbuild, kernel/core/init.c,
          # kernel/feature/sucompat.c, kernel/hook/setuid_hook.c, kernel/supercall/*,
          # kernel/feature/kernel_umount.c, kernel/supercall/dispatch.c) and every one of
          # those rejects is load-bearing: the patch is what wires SUSFS into KernelSU's
          # named hooks (ksu_handle_execveat, ksu_handle_input_handle_event, susfs_init...).
          #
          # We now use KernelSU-Next's SUSFS fork (pershoot/KernelSU-Next dev-susfs), where
          # SUSFS is already integrated, so this patch must NOT be applied. WildKernels do
          # the same: their susfs action applies it only for root_flavor == 'kernelsu' and
          # notes "pershoot dev-susfs (next) ... already include SUSFS, so this is a no-op".
          #
          # The old code applied it, saw rejects, and then relied on a Kconfig grep to prove
          # SUSFS was in - which passed because the Kconfig hunk was one of the few that DID
          # apply. That false green is exactly what let runs #3-#6 get deep into the build.
          echo "--- (2) KernelSU-side SUSFS patch: intentionally SKIPPED (already in the fork) ---"
          if [ -f "$S/KernelSU/10_enable_susfs_for_ksu.patch" ]; then
            echo "note: $S/KernelSU/10_enable_susfs_for_ksu.patch exists but targets upstream"
            echo "      KernelSU (tiann); applying it here would only create rejects."
          fi

          # SUSFS must already be wired into this KernelSU-Next checkout. Re-assert it here
          # because this step is where the false green happened before.
          echo "--- is SUSFS wired into KernelSU-Next's Kconfig? ---"
          KSUSUSFS=$(grep -c 'KSU_SUSFS' "$WORKDIR/common/KernelSU-Next/kernel/Kconfig" 2>/dev/null | tr -dc '0-9')
          echo "KSU_SUSFS occurrences in KernelSU-Next/kernel/Kconfig: ${KSUSUSFS:-0}"
          if [ "${KSUSUSFS:-0}" -eq 0 ]; then
            echo "::error::SUSFS is NOT wired into KernelSU-Next, so CONFIG_KSU_SUSFS would be dropped and SUSFS would be a silent no-op. Stopping before the 2-hour build."
            exit 1
          fi
          echo "OK - KernelSU-Next declares SUSFS options (from the fork, not from a patch)"


          echo "--- (3) kernel-side patch ---"
          P=$(ls "$S"/*android13-5.15*.patch 2>/dev/null | head -1)
          if [ -z "$P" ]; then
            echo "::error::no *android13-5.15*.patch found on branch ${{ inputs.susfs_branch }}"
            ls -la "$S"/ || true
            exit 1
          fi
          echo "applying: $P"
          ( cd "$WORKDIR/common" && patch -p1 --forward -F3 < "$P" ) \
            || echo "::warning::kernel patch reported rejects - handled by the repair step"

          echo "--- SUSFS files present? ---"
          ls -la "$WORKDIR/common/fs/susfs.c" \
                 "$WORKDIR/common/include/linux/susfs.h" \
                 "$WORKDIR/common/include/linux/susfs_def.h" 2>/dev/null || true


      # RUN #3 LESSON: the previous awk heuristic inserted a GUESSED '#include <linux/susfs.h>'
      # and deleted the .rej, throwing away `#include <linux/susfs_def.h>`, the two externs and
      # `#define CL_COPY_MNT_NS BIT(25)` that the applied SUSFS code in fs/namespace.c actually
      # uses (so it could never have compiled). apply_rej.py now re-applies each rejected hunk
      # from its OWN added lines, anchoring on the last NON-BLANK context line - anchoring on the
      # blank one matches the file's first empty line and would drop the code into the header.
      - name: Repair rejected hunks (re-apply them from their own content)
        run: |
          cd "$WORKDIR/common"
          echo "=================== REJECTED HUNKS (before repair) ==================="
          find . -name '*.rej' | sort || true
          echo
          echo "=================== RE-APPLYING THEM FROM THEIR OWN CONTENT ==================="
          # RUN #3 LESSON: the previous awk heuristic inserted a guessed
          # '#include <linux/susfs.h>' and DISCARDED the rest of the rejected hunk - losing
          # '#include <linux/susfs_def.h>' plus the externs and
          # '#define CL_COPY_MNT_NS BIT(25)' that the applied SUSFS code actually uses.
          # apply_rej.py re-applies each rejected hunk using its own added lines, so nothing is
          # guessed. Non-fatal here: some KernelSU-Next rejects are benign because
          # KernelSU-Next already modernised that code.
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_rej.py" "$WORKDIR/common" || true
          echo
          echo "=================== FATAL-IF-MISSING CHECKS ==================="
          rc=0
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; rc=1; fi
          done
          # RUN #7 FIX: the other half of the API contract. KernelSU-Next (pershoot
          # dev-susfs) CALLS into the kernel-side SUSFS - sucompat.c calls
          # susfs_is_current_proc_no_su()/susfs_set_current_proc_no_su(), core/init.c calls
          # susfs_init(), dispatch.c calls susfs_start_sdcard_monitor_fn(). Those live in
          # fs/susfs.c and are declared in these headers. If the KernelSU-Next SUSFS API and
          # the kernel-side SUSFS version disagree, the build dies at link ~2 h in - so
          # check the entry points it actually uses right here, in ~2 min.
          for sym in susfs_init susfs_is_current_proc_no_su susfs_set_current_proc_no_su susfs_start_sdcard_monitor_fn; do
            if grep -qE "\b${sym}\b" include/linux/susfs.h include/linux/susfs_def.h 2>/dev/null; then
              echo "OK      kernel-side SUSFS provides ${sym}"
            else
              echo "MISSING ${sym} in the kernel SUSFS headers - KernelSU-Next calls it, so the build WOULD fail at link"
              rc=1
            fi
          done
          # the applied SUSFS code in fs/namespace.c references CL_COPY_MNT_NS; if the rejected
          # hunk defining it was lost the build is guaranteed to fail, so stop before wasting it
          if grep -q 'CL_COPY_MNT_NS' fs/namespace.c; then
            echo "OK      fs/namespace.c has CL_COPY_MNT_NS"
          else
            echo "MISSING CL_COPY_MNT_NS in fs/namespace.c - the SUSFS hooks there cannot compile"
            rc=1
          fi
          if grep -q 'linux/susfs' fs/proc/task_mmu.c; then
            echo "OK      fs/proc/task_mmu.c references linux/susfs"
          else
            echo "MISSING susfs include in fs/proc/task_mmu.c"
            rc=1
          fi
          echo "--- .rej remaining after repair ---"
          find . -name '*.rej' | sort || true
          # Dump their CONTENTS too. Run #4 taught us this the hard way: the old step `cat`ed every
          # .rej, my replacement only listed names, so the KernelSU-Next rejects became
          # undiagnosable - and those are exactly the hunks we may still have to hand-port if the
          # build later fails on a ksu_*/susfs_* symbol.
          for r in $(find . -name '*.rej' | sort); do
            echo ""
            echo "----- $r -----"
            cat "$r"
          done
          if [ "$rc" -ne 0 ]; then
            echo "::error::SUSFS integration is incomplete - stopping before the build"
            exit 1
          fi
          echo "SUSFS integration looks complete"


      # ---------------------------------------------------------------- config
      # RUN #3 LESSON: kleaf's `check_defconfig` runs `make savedefconfig` and compares the result
      # with kernel_build.defconfig, so ANY hand-edit of gki_defconfig fails with:
      #   ERROR: savedefconfig does not match common/arch/arm64/configs/gki_defconfig
      #   ERROR: common/BUILD.bazel:54:22: Creating kernel config kernel_aarch64_config failed
      # The reason the diff looked so alarming is that KernelSU-Next declares
      #     config KSU / tristate / depends on KPROBES && EXT4_FS / default y
      # so savedefconfig OMITS CONFIG_KSU=y even when it is in force (ditto MODULE_SCMVERSION).
      # `-CONFIG_KSU=y` in that diff did NOT mean KSU was off.
      # Two routes are attempted, cheapest/most-supported first, and whichever works is used for
      # the real build. Both are verified by grepping the GENERATED .config - which is the only
      # thing that actually proves the options landed.
      - name: Stage the KSU + SUSFS kernel config options
        run: |
          cd "$WORKDIR/common"
          set -e
          # The canonical option list lives in this repo.
          OPT="$GITHUB_WORKSPACE/.github/scripts/susfs.config"
          test -f "$OPT"
          cp -v "$OPT" "$RUNNER_TEMP/susfs.config"
          echo "--- $OPT ---"
          cat "$OPT"
          echo "--- gki_defconfig untouched so far ---"
          git status --short arch/arm64/configs/gki_defconfig || true
          # sanity: the kernel-side patch must have produced the SUSFS source files
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

      # ---------------------------------------------------------------- config smoke test
      # The config target takes ~2 minutes; the full dist build takes ~2 hours. Never discover a
      # config problem after the expensive part.
      - name: kleaf config smoke test (fail in ~2 min, not ~2 h)
        run: |
          cd "$WORKDIR"
          rm -rf ./common/android/abi_gki_protected_exports_*
          # RUN #13/#14 LESSON - KILL THE "-maybe-dirty" SUFFIX AT ITS SOURCE (first of two places).
          # It is NOT a stray string: the pinned kleaf's own stamp rule contains
          #     export LOCALVERSION="-maybe-dirty"
          # (build/kernel/kleaf/impl/stamp.bzl, _set_localversion_cmd) and kleaf exports it whenever
          # --config=stamp is absent, which is our case because --config=fast implies --config=local.
          # kbuild appends LOCALVERSION to the end of KERNELRELEASE, which is exactly where the
          # suffix appeared in run #12. Strip the literal so the export becomes LOCALVERSION="", and
          # print the line before and after as proof.
          # NOTE: the file list is collected separately, NOT in a pipeline - run #14 showed that
          # under `set -o pipefail` a grep that matches nothing returns 1 and `set -e` kills the
          # step. Empty means already stripped (this runs in two steps), which is a success.
          echo "--- stamp.bzl LOCALVERSION before strip ---"
          grep -rn 'LOCALVERSION=' ./build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          grep -rnI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null | head -20 || true
          MD_FILES=$(grep -rlI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null || true)
          if [ -n "$MD_FILES" ]; then
            echo "stripping: $MD_FILES"
            echo "$MD_FILES" | while read -r f; do sed -i 's/-maybe-dirty//g' "$f"; done
          else
            echo "(nothing left to strip - already handled)"
          fi
          echo "--- stamp.bzl LOCALVERSION after strip ---"
          grep -rn 'LOCALVERSION=' ./build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          if grep -rqI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null; then
            echo "::error::-maybe-dirty survives under build/ or common/scripts - the release string would not match stock"
            grep -rnI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null | head -20
            exit 1
          fi
          echo "OK   no -maybe-dirty left under build/ or common/scripts"

          echo "============ append the options to gki_defconfig ============"
          DEF=./common/arch/arm64/configs/gki_defconfig
          cp "$DEF" /tmp/gki_defconfig.orig
          cat "$RUNNER_TEMP/susfs.config" >> "$DEF"
          echo "--- defconfig tail ---"
          tail -14 "$DEF"

          echo "============ neutralise the legacy check_defconfig guard ============"
          # RUN #6 LESSON: the guard is not in kleaf at all. It is a bash function in
          # build/kernel/_setup_env.sh (kernel/build's root; the manifest links it to
          # build/_setup_env.sh) that is `export -f`-ed so the ACK's config step can call it. It
          # diffs `make savedefconfig` output against the defconfig FILE, and that generated file
          # lives inside the action's sandbox - it is GONE once the action fails, which is why
          # run #6's "adopt the canonical defconfig" idea could not find it. Making the function
          # return 0 is deterministic and does not care which call site invokes it.
          # (For the record, the pinned kleaf is `master-kernel-build-2022`: no --defconfig_fragment
          # flag and no check-defconfig attribute anywhere in its 131 files, which is why the
          # earlier attempts failed.)
          python3 "$GITHUB_WORKSPACE/.github/scripts/patch_setup_env.py" "$WORKDIR"

          echo "============ build the config target ============"
          # RUN #18 LESSON - --config=stamp is REQUIRED, not optional.
          # The stock config has CONFIG_LOCALVERSION_AUTO=y AND CONFIG_MODULE_SCMVERSION=y, and
          # common/init/Kconfig:2167 says MODULE_SCMVERSION `depends on LOCALVERSION_AUTO`. kleaf's
          # non-stamp path runs `scripts/config -d LOCALVERSION_AUTO`, so without stamp MODULE_SCMVERSION
          # can never be enabled - and MODULE_SCMVERSION is part of the MODULE vermagic that the stock
          # vendor modules carry, so a kernel missing it refuses to load them.
          # With stamp on, kleaf reads common/.scmversion (step 6 pins it to the exact stock value) and
          # the release string comes from the real SCM machinery, exactly as Google builds it.
          tools/bazel build --config=stamp --lto=full //common:kernel_aarch64_config

          echo "============ did the options actually land? ============"
          CFG=$(find "$WORKDIR/out" -path '*/android13-5.15/common/.config' 2>/dev/null | head -1)
          if [ -z "$CFG" ]; then
            CFG=$(find "$WORKDIR/out" -name '.config' -path '*common*' 2>/dev/null | head -1)
          fi
          echo "generated .config: ${CFG:-<not found>}"
          if [ -z "$CFG" ]; then
            # RUN #6 LESSON: the config action runs in a sandbox, so nothing it writes is guaranteed
            # to survive on disk (that is why the generated defconfig could not be found). Fall back
            # to an artifact kleaf CAN leave in the source tree: `run` with the default savedefconfig
            # action copies the minimized defconfig back over gki_defconfig and prints the path.
            echo "--- asking kleaf to write back the minimized defconfig ---"
            tools/bazel run //common:kernel_aarch64_config 2>&1 | tail -15 || true
            echo "--- KSU / SUSFS lines now in $DEF (CONFIG_KSU may be absent: it is 'default y') ---"
            grep -nE '^CONFIG_(KSU|KSU_SUSFS)|^# CONFIG_KSU' "$DEF" || echo "(none)"
            WANT=$(grep -cE '^CONFIG_KSU_SUSFS' "$GITHUB_WORKSPACE/.github/scripts/susfs.config" | tr -dc '0-9')
            GOT=$(grep -cE '^CONFIG_KSU_SUSFS' "$DEF" | tr -dc '0-9')
            echo "SUSFS options requested: ${WANT:-0}   present in the written-back defconfig: ${GOT:-0}"
            if [ "${GOT:-0}" -eq 0 ]; then
              echo "::warning::could not observe the SUSFS options in either artifact - the post-build marker grep is the backstop"
            fi
          else
            echo "--- KSU lines ---"
            grep -nE '^CONFIG_(KSU|KSU_SUSFS)|^# CONFIG_KSU' "$CFG" || echo "(no KSU lines at all)"
            grep -qE '^CONFIG_KSU=y'       "$CFG" || { echo "::error::CONFIG_KSU is not =y in the generated .config"; exit 1; }
            grep -qE '^CONFIG_KSU_SUSFS=y' "$CFG" || { echo "::error::CONFIG_KSU_SUSFS is not =y in the generated .config - SUSFS would be a no-op"; exit 1; }
            WANT=$(grep -cE '^CONFIG_KSU_SUSFS' "$GITHUB_WORKSPACE/.github/scripts/susfs.config" | tr -dc '0-9')
            GOT=$(grep -cE '^CONFIG_KSU_SUSFS' "$CFG" | tr -dc '0-9')
            echo "SUSFS options requested: ${WANT:-0}   present in .config: ${GOT:-0}"
            if [ "${GOT:-0}" -lt "${WANT:-0}" ]; then
              echo "::warning::some SUSFS options did not land - compare the two lists above"
            fi
            echo "OK - KSU and SUSFS are both enabled in the generated .config"
          fi

      # ---------------------------------------------------------------- build
      # ---------------------------------------------------------------- config drift gate
      # RUN #16 LESSON: a kernel that compiles, packs and flashes can still be unbootable, because the
      # vendor modules refuse to load when the config differs from the one they were built against. Run
      # #16 differed in CONFIG_LTO_CLANG_FULL vs THIN, a missing CONFIG_MODULE_SCMVERSION, and a
      # LOCALVERSION pin that masked the source tree not being the release commit.
      # This gate diffs the generated .config against the stock config pulled off the device
      # (.github/boot-template/stock-config.txt) and FAILS on anything except the KernelSU/SUSFS
      # options we add deliberately. It runs here - before the expensive build - so drift costs ~15
      # minutes to find rather than a flash and a bootloop.
      - name: Config drift gate (must match the stock kernel)
        run: |
          cd "$WORKDIR"
          set -e
          CFG=$(find "$WORKDIR/out" -path '*/android13-5.15/common/.config' 2>/dev/null | head -1)
          if [ -z "$CFG" ]; then
            CFG=$(find "$WORKDIR/out" -name '.config' -path '*common*' 2>/dev/null | head -1)
          fi
          echo "generated .config: ${CFG:-<not found>}"
          test -n "$CFG" || { echo "::error::no generated .config - cannot gate on config drift"; exit 1; }
          # RUN #17 LESSON - a config line can be dropped by Kconfig without a word. The gate above
          # reported exactly one remaining difference: CONFIG_MODULE_SCMVERSION is =y in the stock
          # kernel but absent from ours, even though susfs.config sets it. Kconfig drops a symbol
          # silently when its dependencies are unmet, so print the definition straight out of the
          # pinned tree (the authoritative copy) and prove where our line ended up. This runs BEFORE
          # the gate so both appear in the same log.
          echo "--- why is CONFIG_MODULE_SCMVERSION not in our config? ---"
          echo "[1] definition in the pinned tree:"
          grep -rn -B3 -A20 '^config MODULE_SCMVERSION' common/ 2>/dev/null | head -40 || true
          echo "[2] our fragment line:"
          grep -n 'MODULE_SCMVERSION' "$RUNNER_TEMP/susfs.config" 2>/dev/null || true
          echo "[3] did it reach gki_defconfig?"
          grep -n 'MODULE_SCMVERSION' common/arch/arm64/configs/gki_defconfig 2>/dev/null || true
          echo "[4] neighbours in the generated .config:"
          grep -nE 'MODULE_SCMVERSION|MODULE_SIG|MODVERSIONS|LOCALVERSION' "$CFG" 2>/dev/null || true
          echo "[5] every Kconfig predicate mentioning it:"
          grep -rn 'MODULE_SCMVERSION' --include=Kconfig* common/ 2>/dev/null | head -10 || true

          python3 "$GITHUB_WORKSPACE/.github/scripts/kernel_config_diff.py" --config "$CFG"

      - name: kleaf build ${{ inputs.build_target }}
        timeout-minutes: 200
        run: |
          cd "$WORKDIR"
          set -o pipefail
          # (the smoke-test step already applied these two fixes and neutralised check_defconfig)
          rm -rf ./common/android/abi_gki_protected_exports_*
          # RUN #13 LESSON - KILL THE "-maybe-dirty" SUFFIX AT ITS SOURCE (second of two places).
          # Run #12's Image said
          #     5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902-maybe-dirty
          # while the stock device says (nothing_stock_baseline/boot_state.txt)
          #     5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902
          # The ACK revision (g2d8ad9139b89) and build id (ab15063902) already match EXACTLY, so the
          # suffix is the only difference - and it sits in UTS_RELEASE, hence in the vermagic that the
          # 235 vendor modules and Nothing's Wallet/Fenrir attestation compare against. It comes from
          # kleaf's own stamp rule (export LOCALVERSION="-maybe-dirty", used whenever --config=stamp is
          # absent), so stripping the literal turns that export into LOCALVERSION="" and nothing else
          # changes. Verify in seconds, not after the build.
          echo "--- stamp.bzl LOCALVERSION before strip ---"
          grep -rn 'LOCALVERSION=' ./build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          grep -rnI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null | head -20 || true
          # Pipefail-safe: run #14 died here because a grep with no matches returns 1 and set -e
          # aborts the step. "no matches" is success by this point (step 11 strips first).
          MD_FILES=$(grep -rlI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null || true)
          if [ -n "$MD_FILES" ]; then
            echo "stripping: $MD_FILES"
            echo "$MD_FILES" | while read -r f; do sed -i 's/-maybe-dirty//g' "$f"; done
          else
            echo "(nothing left to strip - already handled in the smoke-test step)"
          fi
          echo "--- stamp.bzl LOCALVERSION after strip ---"
          grep -rn 'LOCALVERSION=' ./build/kernel/kleaf/impl/stamp.bzl 2>/dev/null || true
          if grep -rqI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null; then
            echo "::error::-maybe-dirty survives under build/ or common/scripts - the release string would not match stock"
            grep -rnI -- "-maybe-dirty" ./build ./common/scripts 2>/dev/null | head -20
            exit 1
          fi
          echo "OK   no -maybe-dirty left under build/ or common/scripts"

          # RUN #7/#8 LESSON. This step got 30+ min into the kernel compile and was then killed by
          # an ORDERLY SIGTERM - with no compile error, no ENOSPC and no OOM anywhere in the log:
          #     Bazel caught terminate signal; shutting down.
          #     ##[error]The runner has received a shutdown signal ...
          #     ##[error]The operation was canceled.
          # That is a CANCEL, not a build failure. The workflow allows 240 min and had used ~58;
          # there is no concurrency group; GitHub reported no incident at the time. That leaves the
          # account's Actions minutes/spending limit - this repository is PRIVATE, so its minutes
          # are billed and GitHub cancels RUNNING jobs the moment the budget runs out.
          # .github/workflows/canary.yml answers that question in seconds instead of an hour.
          #
          # The previous watchdog wrote to a file and printed it after bazel returned - so the
          # SIGTERM killed the shell first and it never printed anything. This one streams straight
          # to STDOUT, so every sample is already in the log when the kill lands.
          # RUN #11 LESSON - 60 s was too coarse to see the minute before the kill, and the samples
          # never said WHO held the memory. Sample every 20 s and name the top three RSS consumers
          # so a repeat is provable rather than inferred. Run #11's last four samples were
          # 3878 -> 4175 -> 4628 MB used with swap_used=0MB, and the runner was dead 55 s later.
          echo "============ build starting $(date -u +%H:%M:%SZ); sampling every 20s, top-3 RSS named ============"
          (
            while true; do
              printf '%s free=%sGB  ' "$(date -u +%H:%M:%SZ)" \
                "$(df -BG --output=avail "$WORKDIR" 2>/dev/null | tail -1 | tr -dc '0-9')"
              free -m 2>/dev/null | awk '/^Mem:/{printf "mem_used=%sMB mem_avail=%sMB ", $3, $7}'
              free -m 2>/dev/null | awk '/^Swap:/{printf "swap_used=%sMB ", $3}'
              printf 'top=[%s]\n' "$(ps -eo rss=,comm= --sort=-rss 2>/dev/null | head -3 | awk '{printf "%s:%.1fGB ", $2, $1/1048576}')"
              sleep 20
            done
          ) &
          WATCH_PID=$!
          trap 'kill "$WATCH_PID" 2>/dev/null || true' EXIT

          # RUN #19 LESSON - --config=fast MUST NOT be combined with --config=stamp, and kleaf says so
          # in as many words:
          #     fail("--config=local cannot be set with --config=stamp. SCM version cannot be embedded
          #           without sandboxing. See build/kernel/kleaf/sandbox.md.")
          # --config=fast implies --config=local, hence the conflict. The config smoke test above
          # already proved --config=stamp --lto=full works, so the build now uses exactly those flags.
          # Sandboxing does not stop our SUSFS patches being used: they are workspace sources, not
          # local-build shortcuts. Full LTO needs the 16 GB swap added in step 2.
          tools/bazel build --config=stamp --lto=full ${{ inputs.build_target }}
          RC=$?

          kill "$WATCH_PID" 2>/dev/null || true
          echo "============ final state (build exit $RC) ============"
          df -h "$WORKDIR" || true
          free -m || true
          if [ "$RC" -ne 0 ]; then
            echo "::error::kleaf build exited $RC. An exit of 143 is SIGTERM, meaning the JOB was cancelled rather than the build failing - check the Actions billing/spending limit (dispatch .github/workflows/canary.yml) and whether anyone pressed Cancel."
          fi
          exit "$RC"

      # ---------------------------------------------------------------- verify + upload
      - name: Inspect and collect all build outputs
        run: |
          cd "$WORKDIR"
          set -e
          DIST=bazel-bin/common/kernel_aarch64_dist
          echo "================= dist listing ================="
          ls -la "$DIST" || true
          echo "=========== individual expected files =========="
          for f in bazel-bin/common/kernel_aarch64/Image \
                   bazel-bin/common/kernel_aarch64/Image.lz4; do
            if [ -f "$f" ]; then echo "OK   $f ($(stat -c%s "$f") bytes)"; else echo "MISS $f"; fi
          done
          # The lean //common:kernel_aarch64 target may not emit Image.lz4 the way the _dist target
          # does, and GKI boot images carry an lz4-compressed kernel. Make one if it is missing, so a
          # successful build always ships something flashable.
          if [ ! -f bazel-bin/common/kernel_aarch64/Image.lz4 ] && [ -f bazel-bin/common/kernel_aarch64/Image ]; then
            echo "--- Image.lz4 missing - compressing Image ourselves ---"
            command -v lz4 >/dev/null 2>&1 || sudo apt-get install -y -qq lz4 >/dev/null 2>&1 || true
            if command -v lz4 >/dev/null 2>&1; then
              lz4 -l -12 --favor-decSpeed bazel-bin/common/kernel_aarch64/Image \
                  bazel-bin/common/kernel_aarch64/Image.lz4 \
                && echo "OK   created Image.lz4 ($(stat -c%s bazel-bin/common/kernel_aarch64/Image.lz4) bytes)"
            else
              echo "::warning::lz4 is unavailable - shipping the uncompressed Image only (the boot image can be repacked from it)"
            fi
          fi
          echo "--- KSU/SUSFS markers in the built kernel ---"
          strings -a bazel-bin/common/kernel_aarch64/Image | grep -m10 -iE 'kernelsu|susfs' || \
            echo "(none found - KSU may be built as a loadable module)"
          echo "--- version string baked into the kernel ---"
          strings -a bazel-bin/common/kernel_aarch64/Image | grep -m3 -E '5\.15\.197' || true

          # RUN #12 LESSON - THE CHECK THAT DECIDES WHETHER THE PHONE ACCEPTS THIS KERNEL.
          # The stock kernel (nothing_stock_baseline/boot_state.txt) is exactly
          #     5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902
          # and the build must reproduce that string exactly: it IS UTS_RELEASE, so it is part of the
          # vermagic that the vendor modules and the Wallet/Fenrir attestation compare against. Run
          # #12 built "...-ab15063902-maybe-dirty", which no stock module would accept, so the suffix
          # is stripped before the build and its survival is a hard failure here - a kernel that
          # cannot load its modules must never be uploaded.
          # Show the machinery that produced it, so any mismatch is diagnosable from this log alone.
          echo "--- version machinery (evidence) ---"
          echo "common/.scmversion: $(cat ./common/.scmversion 2>/dev/null || echo '<absent>')"
          find out -name 'kernel.release' -o -name 'localversion' 2>/dev/null | sort | head -10 | \
            while read -r f; do echo "  $f => $(head -1 "$f" 2>/dev/null)"; done || true

          EXPECT="5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902"
          if strings -a bazel-bin/common/kernel_aarch64/Image | grep -qxF "$EXPECT"; then
            echo "OK   release string reproduces the stock kernel exactly: $EXPECT"
          else
            echo "::error::the built Image does NOT contain the exact stock release string $EXPECT"
            strings -a bazel-bin/common/kernel_aarch64/Image | grep -m5 -E '5\.15\.197' || true
            exit 1
          fi
          if strings -a bazel-bin/common/kernel_aarch64/Image | grep -q -- '-maybe-dirty'; then
            echo "::error::the Image still carries -maybe-dirty, so vermagic will not match the stock device"
            exit 1
          fi
          echo "OK   no -maybe-dirty suffix anywhere in the kernel"
          # Only copy the small, flashable outputs. The full dist includes vmlinux (hundreds of MB)
          # which would blow the runner's disk AND the artifact size.
          # RUNNER_TEMP is a documented, fixed path - safer than the dynamic WORKDIR here.
          ART="$RUNNER_TEMP/artifacts"
          rm -rf "$ART"; mkdir -p "$ART"
          for f in bazel-bin/common/kernel_aarch64/Image \
                   bazel-bin/common/kernel_aarch64/Image.lz4 \
                   "$DIST"/boot.img "$DIST"/Image "$DIST"/Image.lz4 "$DIST"/kernel_aarch64.bzl ; do
            if [ -f "$f" ]; then cp -v "$f" "$ART"/; fi
          done
          echo "================= artifacts to upload ================="
          ls -la "$ART"
          echo "================= final disk ================="
          df -h "$WORKDIR" "$RUNNER_TEMP"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          retention-days: 14
      # ---------------------------------------------------------------- boot.img packing
      # The lean //common:kernel_aarch64 target emits Image and Image.lz4 only - no boot.img - so this
      # packs a flashable one from the STOCK boot header. The template was extracted from
      # nothing_stock_baseline/flash_tool_readback/ReadBack_..._boot_a_boot.img and committed as
      # .github/boot-template/boot-header.bin. Its values: header_version 4, header_size 1584,
      # ramdisk_size 0 (the ramdisk lives in init_boot on this device), signature_size 0 (the AVB
      # chain is in the vbmeta partition), kernel at page 4096. Copying that header verbatim and
      # swapping only kernel_size means every field the bootloader reads stays byte-identical to
      # stock. .github/scripts/pack_boot.py rebuilds the image and then re-parses it, failing unless
      # each field matches the template and the kernel payload hashes to Image.lz4.
      # This step runs AFTER the Image upload on purpose: a packing problem can never cost you the
      # kernel that already built.
      - name: Pack Image.lz4 into a flashable boot.img (stock template) and verify
        run: |
          cd "$WORKDIR"
          set -e
          TEMPLATE="$GITHUB_WORKSPACE/.github/boot-template"
          K=bazel-bin/common/kernel_aarch64/Image.lz4
          IMG=bazel-bin/common/kernel_aarch64/Image
          EXPECT="5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902"

          if [ ! -f "$TEMPLATE/boot-header.bin" ]; then
            echo "::warning::no committed boot template at $TEMPLATE/boot-header.bin - skipping boot.img"
            exit 0
          fi
          test -f "$K" || { echo "::error::$K is missing - nothing to pack"; exit 1; }
          mkdir -p "$RUNNER_TEMP/artifacts-boot"

          # (1) THE TRUST CHAIN. Prove the COMPRESSED kernel unpacks to exactly the Image whose
          # release string step 13 asserted, so the bytes going into boot.img are the verified ones.
          command -v lz4 >/dev/null 2>&1 || sudo apt-get install -y -qq lz4 >/dev/null 2>&1 || true
          if command -v lz4 >/dev/null 2>&1; then
            lz4 -d -l -c "$K" > "$RUNNER_TEMP/Image.from-lz4" 2>/dev/null || \
              lz4 -d -c "$K" > "$RUNNER_TEMP/Image.from-lz4"
            A=$(sha256sum "$IMG" | cut -d' ' -f1)
            B=$(sha256sum "$RUNNER_TEMP/Image.from-lz4" | cut -d' ' -f1)
            echo "Image            sha256: $A"
            echo "lz4 -d Image.lz4 sha256: $B"
            if [ "$A" != "$B" ]; then
              echo "::error::Image.lz4 does not decompress to the built Image"
              exit 1
            fi
            echo "OK   Image.lz4 decompresses to the very Image whose release string was verified"
            strings -a "$RUNNER_TEMP/Image.from-lz4" | grep -qxF "$EXPECT" || \
              { echo "::error::the kernel going into boot.img does not carry $EXPECT"; exit 1; }
            echo "OK   the kernel going into boot.img carries the stock release string"
            if strings -a "$RUNNER_TEMP/Image.from-lz4" | grep -q -- '-maybe-dirty'; then
              echo "::error::the kernel going into boot.img still carries -maybe-dirty"
              exit 1
            fi
            echo "OK   no -maybe-dirty in the kernel going into boot.img"
          else
            echo "::warning::lz4 unavailable - skipping the decompression cross-check"
          fi

          # (2) pack against the stock header, then verify field by field
          python3 "$GITHUB_WORKSPACE/.github/scripts/pack_boot.py" pack \
            --template-dir "$TEMPLATE" \
            --kernel "$K" \
            --output "$RUNNER_TEMP/artifacts-boot/boot.img"
          ls -la "$RUNNER_TEMP/artifacts-boot"

      - name: Upload flashable boot.img
        uses: actions/upload-artifact@v4
        with:
          name: kernel-boot-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts-boot/*
          if-no-files-found: error
          retention-days: 14






