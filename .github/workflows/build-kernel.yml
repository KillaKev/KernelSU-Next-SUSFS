name: Build GKI kernel (KernelSU-Next + SUSFS) - Nothing Phone 2a / pacman

# Target: Nothing Phone 2a (pacman), NothingOS 4 build 2608130941
# Kernel: 5.15.197-android13-8-00005-g2d8ad9139b89-ab15063902  (GKI, KMI android13-5.15)
#
# SOURCE CHOICE IS CRITICAL: only android13-5.15-2026-03 is v5.15.197 (verified by reading
# each KMI-generation branch's Makefile). Building the same KMI generation is what keeps the
# symbol CRCs identical so the 235 prebuilt /vendor/lib/modules still load
# (the device has CONFIG_MODVERSIONS=y).
#
# Note on vermagic: with CONFIG_MODVERSIONS=y the kernel compares only the flag part of the
# vermagic (it skips the version token - see same_magic(..., has_crcs=true)), so the CRCs are
# the real gate. We still pin the version for cleanliness.

on:
  workflow_dispatch:
    inputs:
      ksu_branch:
        description: 'KernelSU-Next branch/tag to check out'
        required: true
        default: 'dev'
      susfs_branch:
        description: 'susfs4ksu branch - 5.15 options: gki-android13-5.15 (stable) / gki-android13-5.15-dev (latest)'
        required: true
        default: 'gki-android13-5.15-dev'


jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    steps:
      # ---------------------------------------------------------------- workspace + disk
      # FAILED RUN #1 LESSON: "System.IO.IOException: No space left on device:
      #   /home/runner/actions-runner/cached/.../_diag/Worker_....log"
      # That killed the RUNNER ITSELF at 1m44s: the runner's own logs live on /, and the
      # stock ubuntu-latest image leaves / nearly full. So: free space first, then pick
      # whichever mount actually has room, and fail loudly if neither does.
      - name: Free disk space and choose the build mount
        run: |
          echo "================= BEFORE ================="
          df -h / /mnt 2>/dev/null || df -h

          # standard, transparent space reclaim (no third-party action)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/share/swift /usr/lib/jvm /usr/local/lib/node_modules \
                      /opt/az /usr/share/miniconda /usr/local/.ghcup \
                      /usr/lib/google-cloud-sdk "$AGENT_TOOLSDIRECTORY" 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          sudo swapoff -a >/dev/null 2>&1 || true
          sudo rm -f /swapfile /mnt/swapfile >/dev/null 2>&1 || true
          sudo apt-get clean >/dev/null 2>&1 || true

          echo "================= AFTER ================="
          df -h / /mnt 2>/dev/null || df -h

          # pick the mount with the most free space (numbers only, in GB)
          A=$(df -BG --output=avail / 2>/dev/null | tail -1 | tr -dc '0-9'); A=${A:-0}
          B=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9'); B=${B:-0}
          echo "/ has ${A}GB   /mnt has ${B}GB   (need ~40GB)"

          if [ "$B" -gt "$A" ] && [ "$B" -ge 40 ]; then
            WD=/mnt/kernel_workspace
          elif [ "$A" -ge 40 ]; then
            WD="$HOME/kernel_workspace"
          else
            echo "::error::Not enough disk space (${A}GB on /, ${B}GB on /mnt). Need ~40GB."
            df -h
            exit 1
          fi
          mkdir -p "$WD"
          echo "WORKDIR=$WD" >> "$GITHUB_ENV"
          echo "chosen WORKDIR = $WD"
          df -h "$WD"


      # check out this repo so the helper scripts under .github/scripts are available
      - uses: actions/checkout@v4

      - name: Install repo tool
        run: |
          mkdir -p "$HOME/bin"
          curl -sSL https://storage.googleapis.com/git-repo-downloads/repo > "$HOME/bin/repo"
          chmod a+x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          git config --global user.email "ci@localhost"
          git config --global user.name  "kernel-ci"
          git config --global color.ui false

      # ---------------------------------------------------------------- sync
      - name: repo init + sync ACK android13-5.15-2026-03 (v5.15.197)
        run: |
          cd "$WORKDIR"
          repo init -u https://android.googlesource.com/kernel/manifest \
                    -b common-android13-5.15-2026-03
          repo sync -j8 --no-tags --current-branch
          du -sh "$WORKDIR"

      - name: Verify source kernel version is exactly 5.15.197
        run: |
          cd "$WORKDIR"
          set -e
          KV=$(awk '/^VERSION =/{a=$3} /^PATCHLEVEL =/{b=$3} /^SUBLEVEL =/{c=$3} END{print a"."b"."c}' common/Makefile)
          echo "source version: $KV"
          echo "device version: 5.15.197"
          test "$KV" = "5.15.197"

      # ---------------------------------------------------------------- KernelSU-Next
      - name: Integrate KernelSU-Next (${{ inputs.ksu_branch }})
        run: |
          cd "$WORKDIR/common"
          set -e
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/${{ inputs.ksu_branch }}/kernel/setup.sh" \
            | bash -s "${{ inputs.ksu_branch }}"
          test -e drivers/kernelsu
          echo "--- drivers/Makefile tail ---"; tail -3 drivers/Makefile
          echo "--- drivers/Kconfig tail ---";  tail -3 drivers/Kconfig

      # ---------------------------------------------------------------- SUSFS
      # RUN #2 LESSON: the OFFICIAL procedure (susfs4ksu README) is THREE parts, not one:
      #   1. copy the SUSFS source files in (kernel_patches/fs/*, include/linux/*)
      #   2. apply the KernelSU-side patch (10_enable_susfs_for_ksu.patch)
      #   3. apply the kernel-side patch (50_add_susfs_in_gki-android13-5.15.patch)
      # I only did part 3, so fs/susfs.c never existed for the hooks to call into.
      # The README also says: "if there are failed patches, you may try to patch them
      # manually by yourself" — our KMI revision (2026-03) is newer than the one the SUSFS
      # branch was cut from, so a couple of include-block hunks reject. Tolerate + repair.
      - name: Apply SUSFS (full 3-part procedure)
        run: |
          cd "$WORKDIR"
          git clone --depth=1 -b "${{ inputs.susfs_branch }}" \
            https://gitlab.com/simonpunk/susfs4ksu.git /tmp/susfs4ksu
          S=/tmp/susfs4ksu/kernel_patches
          echo "--- patch tree ---"
          find "$S" -maxdepth 2 -type f | sort

          echo "--- (1) copying SUSFS source files ---"
          cp -v "$S"/fs/*            "$WORKDIR/common/fs/"
          cp -v "$S"/include/linux/* "$WORKDIR/common/include/linux/"

          echo "--- (2) KernelSU-side patch ---"
          KP="$S/KernelSU/10_enable_susfs_for_ksu.patch"
          if [ -f "$KP" ]; then
            cp -v "$KP" "$WORKDIR/common/KernelSU-Next/"
            ( cd "$WORKDIR/common/KernelSU-Next" && patch -p1 --forward -F3 < "$KP" ) \
              || echo "::warning::KernelSU-side patch had rejects - KernelSU-Next has diverged from upstream KernelSU"
          else
            echo "!! no KernelSU-side patch at $KP"; ls -la "$S/KernelSU/" 2>/dev/null || true
          fi

          # DECISIVE CHECK. KernelSU-Next's own kernel/Kconfig declares only KSU, KSU_DEBUG,
          # KSU_DISABLE_MANAGER, KSU_DISABLE_POLICY and KSU_X86_PATCH_SYSCALL_DISPATCHER - NO
          # SUSFS, and its kernel/ tree has no susfs files. So if the KernelSU-side patch did not
          # land, CONFIG_KSU_SUSFS will not exist, kconfig will silently DROP it from the
          # defconfig, and we would spend ~2 hours building a kernel whose SUSFS hooks go nowhere.
          echo "--- is SUSFS wired into KernelSU-Next's Kconfig? ---"
          KSUSUSFS=$(grep -c 'KSU_SUSFS' "$WORKDIR/common/KernelSU-Next/kernel/Kconfig" 2>/dev/null | tr -dc '0-9')
          echo "KSU_SUSFS occurrences in KernelSU-Next/kernel/Kconfig: ${KSUSUSFS:-0}"
          if [ "${KSUSUSFS:-0}" -eq 0 ]; then
            echo "=================== KERNELSU-NEXT REJECTS ==================="
            find "$WORKDIR/common/KernelSU-Next" -name '*.rej' -print -exec cat {} \; 2>/dev/null || true
            echo "::error::SUSFS is NOT wired into KernelSU-Next, so CONFIG_KSU_SUSFS would be dropped and SUSFS would be a silent no-op. Stopping before the 2-hour build."
            exit 1
          fi
          echo "OK - KernelSU-Next now declares SUSFS options"


          echo "--- (3) kernel-side patch ---"
          P=$(ls "$S"/*android13-5.15*.patch 2>/dev/null | head -1)
          if [ -z "$P" ]; then
            echo "::error::no *android13-5.15*.patch found on branch ${{ inputs.susfs_branch }}"
            ls -la "$S"/ || true
            exit 1
          fi
          echo "applying: $P"
          ( cd "$WORKDIR/common" && patch -p1 --forward -F3 < "$P" ) \
            || echo "::warning::kernel patch reported rejects - handled by the repair step"

          echo "--- SUSFS files present? ---"
          ls -la "$WORKDIR/common/fs/susfs.c" \
                 "$WORKDIR/common/include/linux/susfs.h" \
                 "$WORKDIR/common/include/linux/susfs_def.h" 2>/dev/null || true


      # RUN #3 LESSON: the previous awk heuristic inserted a GUESSED '#include <linux/susfs.h>'
      # and deleted the .rej, throwing away `#include <linux/susfs_def.h>`, the two externs and
      # `#define CL_COPY_MNT_NS BIT(25)` that the applied SUSFS code in fs/namespace.c actually
      # uses (so it could never have compiled). apply_rej.py now re-applies each rejected hunk
      # from its OWN added lines, anchoring on the last NON-BLANK context line - anchoring on the
      # blank one matches the file's first empty line and would drop the code into the header.
      - name: Repair rejected hunks (re-apply them from their own content)
        run: |
          cd "$WORKDIR/common"
          echo "=================== REJECTED HUNKS (before repair) ==================="
          find . -name '*.rej' | sort || true
          echo
          echo "=================== RE-APPLYING THEM FROM THEIR OWN CONTENT ==================="
          # RUN #3 LESSON: the previous awk heuristic inserted a guessed
          # '#include <linux/susfs.h>' and DISCARDED the rest of the rejected hunk - losing
          # '#include <linux/susfs_def.h>' plus the externs and
          # '#define CL_COPY_MNT_NS BIT(25)' that the applied SUSFS code actually uses.
          # apply_rej.py re-applies each rejected hunk using its own added lines, so nothing is
          # guessed. Non-fatal here: some KernelSU-Next rejects are benign because
          # KernelSU-Next already modernised that code.
          python3 "$GITHUB_WORKSPACE/.github/scripts/apply_rej.py" "$WORKDIR/common" || true
          echo
          echo "=================== FATAL-IF-MISSING CHECKS ==================="
          rc=0
          for f in fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h; do
            if [ -f "$f" ]; then echo "OK      $f"; else echo "MISSING $f"; rc=1; fi
          done
          # the applied SUSFS code in fs/namespace.c references CL_COPY_MNT_NS; if the rejected
          # hunk defining it was lost the build is guaranteed to fail, so stop before wasting it
          if grep -q 'CL_COPY_MNT_NS' fs/namespace.c; then
            echo "OK      fs/namespace.c has CL_COPY_MNT_NS"
          else
            echo "MISSING CL_COPY_MNT_NS in fs/namespace.c - the SUSFS hooks there cannot compile"
            rc=1
          fi
          if grep -q 'linux/susfs' fs/proc/task_mmu.c; then
            echo "OK      fs/proc/task_mmu.c references linux/susfs"
          else
            echo "MISSING susfs include in fs/proc/task_mmu.c"
            rc=1
          fi
          echo "--- .rej remaining after repair ---"
          find . -name '*.rej' | sort || true
          if [ "$rc" -ne 0 ]; then
            echo "::error::SUSFS integration is incomplete - stopping before the build"
            exit 1
          fi
          echo "SUSFS integration looks complete"


      # ---------------------------------------------------------------- config
      # RUN #3 LESSON: kleaf's `check_defconfig` runs `make savedefconfig` and compares the result
      # with kernel_build.defconfig, so ANY hand-edit of gki_defconfig fails with:
      #   ERROR: savedefconfig does not match common/arch/arm64/configs/gki_defconfig
      #   ERROR: common/BUILD.bazel:54:22: Creating kernel config kernel_aarch64_config failed
      # The reason the diff looked so alarming is that KernelSU-Next declares
      #     config KSU / tristate / depends on KPROBES && EXT4_FS / default y
      # so savedefconfig OMITS CONFIG_KSU=y even when it is in force (ditto MODULE_SCMVERSION).
      # `-CONFIG_KSU=y` in that diff did NOT mean KSU was off.
      # Two routes are attempted, cheapest/most-supported first, and whichever works is used for
      # the real build. Both are verified by grepping the GENERATED .config - which is the only
      # thing that actually proves the options landed.
      - name: Stage the KSU + SUSFS kernel config options
        run: |
          cd "$WORKDIR/common"
          set -e
          # The canonical option list lives in this repo.
          OPT="$GITHUB_WORKSPACE/.github/scripts/susfs.config"
          test -f "$OPT"
          cp -v "$OPT" "$RUNNER_TEMP/susfs.config"
          echo "--- $OPT ---"
          cat "$OPT"
          echo "--- gki_defconfig untouched so far ---"
          git status --short arch/arm64/configs/gki_defconfig || true
          # sanity: the kernel-side patch must have produced the SUSFS source files
          ls -la fs/susfs.c include/linux/susfs.h include/linux/susfs_def.h

      # ---------------------------------------------------------------- config smoke test
      # The config target takes ~2 minutes; the full dist build takes ~2 hours. Never discover a
      # config problem after the expensive part.
      - name: kleaf config smoke test (fail in ~2 min, not ~2 h)
        run: |
          cd "$WORKDIR"
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl

          echo "============ append the options to gki_defconfig ============"
          cp ./common/arch/arm64/configs/gki_defconfig /tmp/gki_defconfig.orig
          cat "$RUNNER_TEMP/susfs.config" >> ./common/arch/arm64/configs/gki_defconfig
          echo "--- defconfig tail ---"
          tail -14 ./common/arch/arm64/configs/gki_defconfig

          echo "============ force kleaf's check_defconfig to disabled ============"
          # RUN #4 LESSON: --defconfig_fragment does NOT exist in this kleaf vintage
          # ("Unrecognized option: --defconfig_fragment"), and common/BUILD.bazel has no
          # kernel_build() call to edit - it is `define_common_kernels(target_configs = {...})`.
          # The guard we keep hitting lives in build/kernel/kleaf/common_kernels.bzl as:
          #     check_defconfig = select({
          #         Label("//build/kernel/kleaf:gki_build_config_fragment_is_unset"):
          #             "match" if pre_defconfig_fragments else "minimized",
          #         "//conditions:default": "disabled",
          #     })
          # i.e. a pure GKI build does the strict savedefconfig comparison. Force "disabled";
          # the .config grep below is the check that actually matters.
          python3 "$GITHUB_WORKSPACE/.github/scripts/disable_check_defconfig.py" "$WORKDIR"

          echo "============ build the config target ============"
          tools/bazel build //common:kernel_aarch64_config

          echo "============ did the options actually land in .config? ============"
          CFG=$(find "$WORKDIR/out" -path '*/android13-5.15/common/.config' 2>/dev/null | head -1)
          if [ -z "$CFG" ]; then
            CFG=$(find "$WORKDIR/out" -name '.config' -path '*common*' 2>/dev/null | head -1)
          fi
          echo "generated .config: ${CFG:-<not found>}"
          if [ -z "$CFG" ]; then
            echo "::warning::could not find the generated .config - the post-build marker grep is the backstop"
          else
            echo "--- KSU lines ---"
            grep -nE '^CONFIG_(KSU|KSU_SUSFS)|^# CONFIG_KSU' "$CFG" || echo "(no KSU lines at all)"
            grep -qE '^CONFIG_KSU=y'       "$CFG" || { echo "::error::CONFIG_KSU is not =y in the generated .config"; exit 1; }
            grep -qE '^CONFIG_KSU_SUSFS=y' "$CFG" || { echo "::error::CONFIG_KSU_SUSFS is not =y in the generated .config - SUSFS would be a no-op"; exit 1; }
            WANT=$(grep -cE '^CONFIG_KSU_SUSFS' "$GITHUB_WORKSPACE/.github/scripts/susfs.config")
            GOT=$(grep -cE '^CONFIG_KSU_SUSFS' "$CFG" | tr -dc '0-9')
            echo "SUSFS options requested: $WANT   present in .config: ${GOT:-0}"
            if [ "${GOT:-0}" -lt "$WANT" ]; then
              echo "::warning::some SUSFS options did not land - compare the two lists above"
            fi
            echo "OK - KSU and SUSFS are both enabled in the generated .config"
          fi

      # ---------------------------------------------------------------- build
      - name: kleaf build //common:kernel_aarch64_dist
        run: |
          cd "$WORKDIR"
          set -o pipefail
          # (the smoke-test step already applied these two fixes and disabled check_defconfig)
          rm -rf ./common/android/abi_gki_protected_exports_*
          sed -i "/stable_scmversion_cmd/s/-maybe-dirty//g" ./build/kernel/kleaf/impl/stamp.bzl
          tools/bazel build --config=fast --stamp //common:kernel_aarch64_dist

      # ---------------------------------------------------------------- verify + upload
      - name: Inspect and collect all build outputs
        run: |
          cd "$WORKDIR"
          set -e
          DIST=bazel-bin/common/kernel_aarch64_dist
          echo "================= dist listing ================="
          ls -la "$DIST" || true
          echo "=========== individual expected files =========="
          for f in bazel-bin/common/kernel_aarch64/Image \
                   bazel-bin/common/kernel_aarch64/Image.lz4; do
            if [ -f "$f" ]; then echo "OK   $f ($(stat -c%s "$f") bytes)"; else echo "MISS $f"; fi
          done
          echo "--- KSU/SUSFS markers in the built kernel ---"
          strings -a bazel-bin/common/kernel_aarch64/Image | grep -m10 -iE 'kernelsu|susfs' || \
            echo "(none found - KSU may be built as a loadable module)"
          echo "--- version string baked into the kernel ---"
          strings -a bazel-bin/common/kernel_aarch64/Image | grep -m3 -E '5\.15\.197' || true
          # Only copy the small, flashable outputs. The full dist includes vmlinux (hundreds of MB)
          # which would blow the runner's disk AND the artifact size.
          # RUNNER_TEMP is a documented, fixed path - safer than the dynamic WORKDIR here.
          ART="$RUNNER_TEMP/artifacts"
          rm -rf "$ART"; mkdir -p "$ART"
          for f in bazel-bin/common/kernel_aarch64/Image \
                   bazel-bin/common/kernel_aarch64/Image.lz4 \
                   "$DIST"/boot.img "$DIST"/Image "$DIST"/Image.lz4 "$DIST"/kernel_aarch64.bzl ; do
            if [ -f "$f" ]; then cp -v "$f" "$ART"/; fi
          done
          echo "================= artifacts to upload ================="
          ls -la "$ART"
          echo "================= final disk ================="
          df -h "$WORKDIR" "$RUNNER_TEMP"

      - name: Upload kernel artifacts
        uses: actions/upload-artifact@v4
        with:
          name: kernel-Image-${{ github.run_number }}
          path: ${{ runner.temp }}/artifacts/*
          if-no-files-found: error
          retention-days: 14




